      ${kpiCard("Needs Manual Check", needCheck.length.toLocaleString("id-ID"), "zero stock but rarely ordered", needCheck.length>0?"bad":"good")}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-abc-class", "Value per ABC Class", "A = Nilai Tinggi (prioritas utama) · B = Nilai Sedang · C = Nilai Rendah (banyak jenis, kontribusi kecil)")}
      ${chartCardShell("chart-abc-fms", "FMS Distribution", "F = Fast, sering bergerak · M = Medium · S = Slow, jarang bergerak")}
    </div>
    ${tableHtml("🔴 Order Suggestion — Order Immediately (sorted Class A→C, then order value)",
      ["Part No","Description","ABC","FMS","Current Inv.","In Transit","Target Stock","Order Freq. 12 Months","Suggested Order Qty","Estimated Value"],
      topNeedOrder.map(r=>[escapeHtml(r.part), escapeHtml(r.desc), escapeHtml(r.abc), escapeHtml(r.fms),
        toNum(r.currentInventory), toNum(r.inTransit), Math.round(toNum(r.stockToCarry)), toNum(r.orderFreq), Math.round(-toNum(r.monthlyOrder)), fmtRp(toNum(r.orderValue))]))}
    ${tableHtml("🟡 Needs Manual Check (zero stock, but historically rarely ordered)",
      ["Part No","Description","ABC","FMS","Current Inv.","In Transit","Target Stock","Order Freq. 12 Months"],
      topNeedCheck.map(r=>[escapeHtml(r.part), escapeHtml(r.desc), escapeHtml(r.abc), escapeHtml(r.fms),
        toNum(r.currentInventory), toNum(r.inTransit), Math.round(toNum(r.stockToCarry)), toNum(r.orderFreq)]))}
    ${tableHtml("Highest-Value Parts", ["Part No","Description","ABC","FMS","Value"],
      topN(rows, r=>toNum(r.value), 8).map(r=>[escapeHtml(r.part), escapeHtml(r.desc), escapeHtml(r.abc), escapeHtml(r.fms), fmtRp(toNum(r.value))]))}
    <div class="empty-note">Data ini snapshot harian dari sheet Analysis (bukan real-time detik-ke-detik) — sesuai jadwal refresh otomatis jam 06:00.</div>
  `;
  const ABC_COLORS = { A: COLORS.blue, B: COLORS.green, C: COLORS.orange };
  drawBar("chart-abc-class", ["A","B","C"], [{label:"Value", data:["A","B","C"].map(k=>valueByClass[k]||0), color:["A","B","C"].map(k=>ABC_COLORS[k])}]);
  const FMS_ORDER = ["F","M","S"];
  const FMS_COLORS = { F: COLORS.blue, M: COLORS.green, S: COLORS.orange };
  const fmsLabels = FMS_ORDER.filter(k => countByFms[k] !== undefined);
  drawPie("chart-abc-fms", fmsLabels, fmsLabels.map(k=>countByFms[k]), fmsLabels.map(k=>FMS_COLORS[k]));
}

async function renderOsa(){
  const s = await fetchSheet("osa");
  let rowsRaw = rowsToObjects(s, { date:1, item:2, desc:3, warehouseCode:5, warehouse:6, qty:4, realisasi:8, cek:9 });
  rowsRaw = rowsRaw.filter(r => r.item); // buang baris sisa formula/validasi (kosong tapi kebaca "ada isi")
  if(currentCompany === "IKE" && rowsRaw.length === 0){ pageBody.innerHTML = noIkeDataBanner("On Shelves Availability"); return; }
  rowsRaw.forEach(r => { r.branch = r.warehouseCode ? String(r.warehouseCode).split("-")[0].trim() : ""; });
  const rowsAllDates = applyFilters(rowsRaw, null, "branch"); // untuk chart tren — tidak ikut filter tanggal
  let rows = applyFilters(rowsRaw, "date", "branch"); // untuk KPI & tabel — ikut filter tanggal

  const total = rows.length;
  const fulfilled = rows.filter(r=>toNum(r.cek)>=0).length;
  const fulfillRate = total ? Math.round(fulfilled/total*100) : 0;
  const shortfallItems = rows.filter(r=>toNum(r.cek)<0);
  const totalShortQty = shortfallItems.reduce((a,r)=>a+Math.abs(toNum(r.cek)),0);

  const shortByWarehouse = groupSum(shortfallItems, r=>r.warehouse, r=>Math.abs(toNum(r.cek)));
  const worst = topN(rows, r=>-toNum(r.cek), 8);

  // Tren Fulfillment Rate per bulan (basis jumlah Part No/baris permintaan) — Januari s.d. bulan berjalan, tidak terpengaruh filter tanggal
  const trendPeriods = yearToDatePeriods();
  const totalReqByPeriod = trendPeriods.map(p => rowsAllDates.filter(r=>periodKey(r.date)===p).length);
  const fulfilledReqByPeriod = trendPeriods.map(p => rowsAllDates.filter(r=>periodKey(r.date)===p && toNum(r.cek)>=0).length);
  const rateByPeriod = trendPeriods.map((p,i) => totalReqByPeriod[i] ? Math.round(fulfilledReqByPeriod[i]/totalReqByPeriod[i]*100) : null);

  const whEntries0 = Object.entries(shortByWarehouse).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Resume per Cabang
  const osaBranches = Array.from(new Set(rows.map(r=>r.branch).filter(Boolean))).sort();
  const osaResumeRows = osaBranches.map(branch => {
    const branchRows = rows.filter(r=>r.branch===branch);
    const branchFulfilled = branchRows.filter(r=>toNum(r.cek)>=0).length;
    const branchRate = branchRows.length ? Math.round(branchFulfilled/branchRows.length*100) : 0;
    return [escapeHtml(branch), branchRows.length.toLocaleString("id-ID"), branchFulfilled.toLocaleString("id-ID"), branchRate+"%"];
  });

  pageBody.innerHTML = `
    <div class="kpi-row">
      ${kpiCard("Fulfillment Rate", fulfillRate+"%", fulfilled + " dari " + total + " permintaan", fulfillRate>=85?"good":"bad")}
      ${kpiCard("Short Stock Items", shortfallItems.length.toLocaleString("id-ID"), "dari " + total + " permintaan", "bad")}
      ${kpiCard("Total Qty Shortfall", totalShortQty.toLocaleString("id-ID"), "units short", "bad")}
      ${kpiCard("Warehouses Involved", Object.keys(groupCount(rows,r=>r.warehouse)).length, "", "neutral")}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-osa-trend", "Fulfillment Rate Trend per Month (Part No Count)")}
      ${chartCardShell("chart-osa-ordersupply", "Total Demand vs Fulfilled per Month (Part No Count)")}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-osa-warehouse", "Shortfall per Warehouse")}
    </div>
    ${tableHtml("Summary per Branch", ["Branch","Total Demand (Part No)","Fulfilled (Part No)","Fulfillment Rate %"], osaResumeRows)}
    ${tableHtml("Items with Largest Shortfall", ["Item No","Description","Warehouse","Requested","Fulfilled","Shortfall"],
      worst.filter(r=>toNum(r.cek)<0).map(r=>[escapeHtml(r.item), escapeHtml(r.desc), escapeHtml(r.warehouse), toNum(r.qty), toNum(r.realisasi), Math.abs(toNum(r.cek))]))}
  `;
  drawLine("chart-osa-trend", trendPeriods.map(periodLabel), [{label:"Fulfillment Rate (%)", data:rateByPeriod.map(v=>v==null?0:v), color:COLORS.teal}]);
  drawBar("chart-osa-ordersupply", trendPeriods.map(periodLabel), [
    { label:"Total Demand (Part No)", data:totalReqByPeriod, color:COLORS.gold },
    { label:"Fulfilled (Part No)", data:fulfilledReqByPeriod, color:COLORS.teal },
  ]);
  drawBar("chart-osa-warehouse", whEntries0.map(e=>e[0]), [{label:"Qty Short", data:whEntries0.map(e=>e[1]), color:COLORS.red}]);
}

/* ============================================================== *
 *  PARTS > INVENTORY TURN OVER                                     *
 * ============================================================== */
const TURNOVER_TARGET = 3; // kebijakan perusahaan: 3x per tahun
const TURNOVER_MIN_STOCK_VALUE = 1000000; // di bawah ini, nilai stok dianggap tidak representatif untuk dihitung rasio (Rp 1 Jt)

async function renderInventoryTurnover(){
  const [s, stockS] = await Promise.all([
    fetchSheet("abcfms"), // sumbernya sama dengan ABC-FMS Analysist (Master_AllBranches)
    fetchSheet("stock").catch(()=>null),
  ]);
  let rows = rowsToObjects(s, {
    branch:0, part:1, desc:2, qty:3, value:4, avgPrice:5, valueContribution:6, abc:7, qtyContribution:8,
    fms:9, category:10, avgMovement:11, orderFreq:12, jcbNorms:13, growthFactor:14, transitTimeM:15,
    stockToCarry:16, currentInventory:17, inTransit:18, monthlyOrder:19, suggestionStatus:20, orderValue:21
  });
  rows = rows.filter(r => r.part); // buang baris sisa formula/validasi (kosong tapi kebaca "ada isi")
  if(currentCompany === "IKE" && rows.length === 0){ pageBody.innerHTML = noIkeDataBanner("Inventory Turn Over"); return; }
  rows = applyFilters(rows, null, "branch");

  // Harga untuk menilai STOK SAAT INI sebaiknya ikut harga di sheet "Stock On Hand" (per Item+Branch),
  // bukan kolom "avg (IDR)" di ABC-FMS Analysis — itu rata-rata harga pergerakan/keluar 12 bulan
  // TERGABUNG semua cabang, jadi bisa salah untuk part yang harganya beda per cabang (mis. RIM
  // bawaan unit di JKT, harganya beda dari Stock RIM biasa di cabang lain). Fallback ke rata-rata
  // per Item (semua cabang) kalau kombinasi Item+Branch itu tidak ada di Stock On Hand, dan ke
  // avg (IDR) ABC-FMS kalau item itu sama sekali tidak ketemu di Stock On Hand (mis. stok 0 / part
  // sudah tidak ada baris stok-nya lagi).
  const stockPriceByItemBranch = {}, stockPriceByItem = {};
  if(stockS){
    rowsToObjects(stockS, { item:0, branch:5, price:6 }).forEach(r => {
      const price = toNum(r.price);
      if(!price || !r.item) return;
      stockPriceByItemBranch[r.item + "|" + r.branch] = price;
      if(!(r.item in stockPriceByItem)) stockPriceByItem[r.item] = price;
    });
  }
  rows.forEach(r => {
    r.movementValue = toNum(r.value); // nilai keluar 12 bulan
    const priceFromStock = stockPriceByItemBranch[r.part + "|" + r.branch] ?? stockPriceByItem[r.part];
    r.priceUsed = priceFromStock != null ? priceFromStock : toNum(r.avgPrice);
    r.priceSource = priceFromStock != null ? "stock" : "abcAvg";
    r.stockValue = toNum(r.currentInventory) * r.priceUsed;
    r.turnover = r.stockValue > 0 ? r.movementValue / r.stockValue : null;
  });

  const withStock = rows.filter(r => r.stockValue > 0);
  const totalMovement = rows.reduce((a,r)=>a+r.movementValue, 0);
  const totalStockValue = withStock.reduce((a,r)=>a+r.stockValue, 0);
  const overallTurnover = totalStockValue >= TURNOVER_MIN_STOCK_VALUE ? totalMovement / totalStockValue : null;
  const daysOfSupply = overallTurnover ? Math.round(365 / overallTurnover) : null;

  const underperform = withStock.filter(r => r.turnover < TURNOVER_TARGET);
  const underperformValue = underperform.reduce((a,r)=>a+r.stockValue, 0);
  const achievedCount = withStock.filter(r => r.turnover >= TURNOVER_TARGET).length;
  const achievedPct = withStock.length ? Math.round(achievedCount/withStock.length*100) : null;

  // Turnover per Cabang — kalau nilai stok cabang itu di bawah ambang batas, turnover ditandai tidak representatif (bukan dihitung mentah)
  const branches = Array.from(new Set(rows.map(r=>r.branch).filter(Boolean))).sort();
  const turnoverByBranch = branches.map(branch => {
    const bRows = withStock.filter(r=>r.branch===branch);
    const bMovement = rows.filter(r=>r.branch===branch).reduce((a,r)=>a+r.movementValue,0);
    const bStock = bRows.reduce((a,r)=>a+r.stockValue,0);
    const isRepresentative = bStock >= TURNOVER_MIN_STOCK_VALUE;
    return { branch, movement:bMovement, stock:bStock, turnover: isRepresentative ? bMovement/bStock : null, isRepresentative };
  });

  // Turnover per Kelas ABC — sama, pakai ambang batas yang sama
  const abcClasses = ["A","B","C"];
  const turnoverByAbc = abcClasses.map(cls => {
    const cRows = withStock.filter(r=>r.abc===cls);
    const cMovement = rows.filter(r=>r.abc===cls).reduce((a,r)=>a+r.movementValue,0);
    const cStock = cRows.reduce((a,r)=>a+r.stockValue,0);
    const isRepresentative = cStock >= TURNOVER_MIN_STOCK_VALUE;
    return { cls, turnover: isRepresentative ? cMovement/cStock : null, isRepresentative };
  });

  // Perlu Perhatian: turnover di bawah target, diurutkan dari nilai stok terbesar (uang paling banyak mengendap)
  const topUnderperform = topN(underperform, r=>r.stockValue, 10);

  // Resume per Cabang
  const resumeRows = turnoverByBranch.map(t => [
    escapeHtml(t.branch), fmtRp(t.movement), fmtRp(t.stock),
    t.isRepresentative ? t.turnover.toFixed(1)+"x" : "N/A (stok < "+fmtRpShort(TURNOVER_MIN_STOCK_VALUE)+")",
    !t.isRepresentative ? "⚪ Not Representative" : (t.turnover>=TURNOVER_TARGET ? "✅ Achieved" : "❌ Below Target")
  ]);

  pageBody.innerHTML = `
    <div class="kpi-row">
      ${kpiCard("Inventory Turnover", overallTurnover!=null?overallTurnover.toFixed(1)+"x":"—", "Company target: "+TURNOVER_TARGET+"x/year", overallTurnover!=null?(overallTurnover>=TURNOVER_TARGET?"good":"bad"):"neutral")}
      ${kpiCard("Days of Supply", daysOfSupply!=null?daysOfSupply+" hari":"—", "how long stock will last", "neutral")}
      ${kpiCard("Underperforming Stock Value", fmtRpShort(underperformValue), underperform.length+" Part No below target", underperform.length>0?"bad":"good")}
      ${kpiCard("% Part No Meeting Target", achievedPct!=null?achievedPct+"%":"—", achievedCount+" dari "+withStock.length+" Part No (with stock)", achievedPct!=null?(achievedPct>=50?"good":"bad"):"neutral")}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-turnover-branch", "Turnover per Branch", "Hijau = capai target "+TURNOVER_TARGET+"x, Merah = di bawah target, Abu-abu = stok < "+fmtRpShort(TURNOVER_MIN_STOCK_VALUE)+" (not representative)")}
      ${chartCardShell("chart-turnover-abc", "Turnover per ABC Class", "A = Nilai Tinggi (prioritas utama) · B = Nilai Sedang · C = Nilai Rendah (banyak jenis, kontribusi kecil). Class A idealnya berputar lebih cepat dari C.")}
    </div>
    ${tableHtml("🔴 Needs Attention — Lowest Turnover (largest stock value tied up)",
      ["Part No","Description","Branch","ABC","Stock Value","Turnover"],
      topUnderperform.map(r=>[escapeHtml(r.part), escapeHtml(r.desc), escapeHtml(r.branch), escapeHtml(r.abc), fmtRp(r.stockValue), r.turnover.toFixed(1)+"x"]))}
    ${tableHtml("Summary per Branch", ["Branch","Issued Value (12 Months)","Stock Value","Turnover","Status"], resumeRows)}
    <div class="empty-note">Catatan: Turnover di sini dihitung dari Nilai Keluar 12 bulan ÷ Nilai Stok SAAT INI (snapshot terbaru) — pendekatan ini dipakai karena histori stok bulanan baru mulai dikumpulkan. Begitu histori beberapa bulan terkumpul, perhitungan bisa ditingkatkan pakai rata-rata stok yang lebih presisi. Cabang/kelas dengan nilai stok di bawah Rp 1 Juta ditandai "N/A" karena rasionya bisa melonjak tidak wajar meski pembilangnya (nilai keluar) kecil.</div>
  `;

  const branchColors = turnoverByBranch.map(t => !t.isRepresentative ? "#a8a29e" : (t.turnover>=TURNOVER_TARGET ? COLORS.green : COLORS.red));
  drawBar("chart-turnover-branch", turnoverByBranch.map(t=>t.branch), [{label:"Turnover (x)", data:turnoverByBranch.map(t=>t.isRepresentative?Number(t.turnover.toFixed(2)):0), color:branchColors}]);
  const abcColors = turnoverByAbc.map(t => !t.isRepresentative ? "#a8a29e" : (t.turnover>=TURNOVER_TARGET ? COLORS.green : COLORS.red));
  drawBar("chart-turnover-abc", turnoverByAbc.map(t=>t.cls), [{label:"Turnover (x)", data:turnoverByAbc.map(t=>t.isRepresentative?Number(t.turnover.toFixed(2)):0), color:abcColors}]);
}
const FULL_MONTHS = ["January","February","March","April","May","June","July","August",
  "September","October","November","December"];
function parseFullMonthPeriod(monthText, yearText){
  const idx = FULL_MONTHS.findIndex(m => m.toLowerCase() === String(monthText||"").trim().toLowerCase());
  if(idx === -1 || !yearText) return null;
  return `${yearText}-${String(idx+1).padStart(2,"0")}`;
}

const PART_GROUP_OTHER = "Other";
const PART_GROUP_ORDER = PART_GROUP_RULES.map(r=>r[0]).concat([PART_GROUP_OTHER]);
let partGroupOverrides = null; // { PARTNO_UPPER: "Group" }
async function loadPartGroupOverrides(){
  if(partGroupOverrides) return partGroupOverrides;
  const map = {};
  try{
    const raw = await fetchSheetRaw("Part Group Mapping");
    raw.rows.forEach(r => {
      const pn = String(r[0]==null?"":r[0]).trim().toUpperCase(), g = String(r[1]==null?"":r[1]).trim();
      if(pn && g) map[pn] = g;
    });
  }catch(e){ /* tab belum dibuat -> pakai aturan keyword saja */ }
  partGroupOverrides = map;
  return map;
}
function partGroupOf(partNo, desc){
  const ov = partGroupOverrides && partGroupOverrides[String(partNo==null?"":partNo).trim().toUpperCase()];
  if(ov) return ov;
  const d = String(desc==null?"":desc).toUpperCase();
  for(const [g, rx] of PART_GROUP_RULES){ if(rx.test(d)) return g; }
  return PART_GROUP_OTHER;
}
let profilePartGroup = ""; // filter Part Group di halaman Inventory Profile ("" = semua)

async function renderInventoryProfile(){
  const s = await fetchSheet("invProfile");
  await loadPartGroupOverrides();
  let rows = rowsToObjects(s, {
    branch:0, partNo:1, desc:2, model:3, inStock:4, rollOut12m:5,
    lastGrDate:6, lastGiDate:7, agingByGr:9, agingByGi:10, category:11,
    pricePerQty:12, totalValue:13, month:14, year:15
  });
  rows = rows.filter(r => r.partNo); // buang baris sisa formula/validasi (kosong tapi kebaca "ada isi")
  if(currentCompany === "IKE" && rows.length === 0){ pageBody.innerHTML = noIkeDataBanner("Inventory Profile"); return; }
  rows = applyFilters(rows, null, "branch");
  rows.forEach(r => { r.period = parseFullMonthPeriod(r.month, r.year); r.partGroup = partGroupOf(r.partNo, r.desc); });

  const allPeriods = Array.from(new Set(rows.map(r=>r.period).filter(Boolean))).sort();
  const latestPeriod = allPeriods[allPeriods.length - 1];
  const latestLabel = latestPeriod ? (FULL_MONTHS[Number(latestPeriod.split("-")[1])-1] + " " + latestPeriod.split("-")[0]) : "-";
  const rowsLatestAllGroups = latestPeriod ? rows.filter(r => r.period === latestPeriod) : rows;
  // Ringkasan per Part Group (selalu semua group, supaya perbandingan antar group tetap terlihat)
  const pgStats = PART_GROUP_ORDER.map(g => {
    const rs = rowsLatestAllGroups.filter(r => r.partGroup === g);
    const val = rs.reduce((a,r)=>a+toNum(r.totalValue),0);
    const dead = rs.filter(r=>r.category==="DEAD STOCK").reduce((a,r)=>a+toNum(r.totalValue),0);
    return { g, n: rs.length, val, dead };
  }).filter(x => x.n > 0).sort((a,b)=>b.val-a.val);
  const pgTotalVal = pgStats.reduce((a,x)=>a+x.val,0);
  if(profilePartGroup && !pgStats.some(x=>x.g===profilePartGroup)) profilePartGroup = "";
  if(profilePartGroup) rows = rows.filter(r => r.partGroup === profilePartGroup);
  const rowsLatest = profilePartGroup ? rowsLatestAllGroups.filter(r => r.partGroup === profilePartGroup) : rowsLatestAllGroups;

  const totalSkus = rowsLatest.length;
  const totalValue = rowsLatest.reduce((a,r)=>a+toNum(r.totalValue),0);
  const valueByCategory = groupSum(rowsLatest, r=>r.category, r=>toNum(r.totalValue));
  const countByCategory = groupCount(rowsLatest, r=>r.category);
  const deadValue = valueByCategory["DEAD STOCK"] || 0;
  const deadCount = countByCategory["DEAD STOCK"] || 0;
  const fastValue = valueByCategory["FAST"] || 0;

  // Skema warna tetap: Dead Stock=Merah, Slow=Orange, Medium=Hijau, Fast=Biru
  const CAT_COLORS = { "DEAD STOCK": COLORS.red, "SLOW": COLORS.orange, "MEDIUM": COLORS.green, "FAST": COLORS.blue };
  const allCats = ["DEAD STOCK","SLOW","MEDIUM","FAST"];
  const catOrder = allCats.filter(c => countByCategory[c] !== undefined);
  const topDead = topN(rowsLatest.filter(r=>r.category==="DEAD STOCK"), r=>toNum(r.totalValue), 8);
  // Semua Dead Stock bulan terbaru (ikut filter Company/Branch), urut Value terbesar — untuk Export Excel
  const allDead = rowsLatest.filter(r=>r.category==="DEAD STOCK").sort((a,b)=>toNum(b.totalValue)-toNum(a.totalValue));

  // Jumlah Part No per Model (top 8 + Lainnya)
  const countByModel = groupCount(rowsLatest.filter(r=>r.model), r=>r.model);
  const modelEntriesSorted = Object.entries(countByModel).sort((a,b)=>b[1]-a[1]);
  const topModels = modelEntriesSorted.slice(0,8);
  const otherModelsCount = modelEntriesSorted.slice(8).reduce((a,[,v])=>a+v,0);
  const modelLabels = topModels.map(e=>e[0]).concat(otherModelsCount>0 ? ["Others"] : []);
  const modelCounts = topModels.map(e=>e[1]).concat(otherModelsCount>0 ? [otherModelsCount] : []);

  // Tren bulanan per kategori (memakai SEMUA periode yang ada, bukan cuma bulan terbaru)
  const trendPeriods = allPeriods.slice(-8);
  const trendByCat = {};
  allCats.forEach(cat => {
    trendByCat[cat] = trendPeriods.map(p => {
      const matching = rows.filter(r => r.period === p && r.category === cat);
      return matching.reduce((a,r)=>a+toNum(r.totalValue),0);
    });
  });

  // Breakdown per cabang (bulan terbaru)
  const branches = Array.from(new Set(rowsLatest.map(r=>r.branch).filter(Boolean))).sort();
  const branchCatValue = {};
  branches.forEach(b => {
    branchCatValue[b] = {};
    allCats.forEach(cat => {
      branchCatValue[b][cat] = rowsLatest.filter(r=>r.branch===b && r.category===cat).reduce((a,r)=>a+toNum(r.totalValue),0);
    });
  });

  pageBody.innerHTML = `
    <div class="empty-note" style="margin-bottom:12px;">Menampilkan snapshot bulan terbaru: <strong>${escapeHtml(latestLabel)}</strong> (${allPeriods.length} bulan histori tersedia untuk tren di bawah).
      <span style="margin-left:14px;">Part Group:
        <select id="profile-pg-select" style="padding:4px 8px;border-radius:6px;margin-left:4px;">
          <option value="">All Part Groups</option>
          ${pgStats.map(x=>`<option value="${escapeHtml(x.g)}"${x.g===profilePartGroup?" selected":""}>${escapeHtml(x.g)}</option>`).join("")}
        </select></span></div>
    <div class="kpi-row">
      ${kpiCard("Total Part No", totalSkus.toLocaleString("id-ID"), latestLabel, "neutral")}
      ${kpiCard("Total Inventory Value", fmtRpShort(totalValue), latestLabel, "neutral")}
      ${kpiCard("Dead Stock", fmtRpShort(deadValue), deadCount + " Part No · " + (totalValue?Math.round(deadValue/totalValue*100):0) + "% of total value", deadValue>0?"bad":"good")}
      ${kpiCard("Fast Moving", fmtRpShort(fastValue), (totalValue?Math.round(fastValue/totalValue*100):0) + "% of total value", "good")}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-profile-value", "Value per Category — " + latestLabel)}
      ${chartCardShell("chart-profile-count", "Part No Count per Model — " + latestLabel)}
    </div>
    <div class="charts-row">
      ${chartCardShell("chart-profile-branch", "Inventory Status per Branch — " + latestLabel)}
      ${chartCardShell("chart-profile-pg", "Inventory Value per Part Group — " + latestLabel)}
    </div>
    ${tableHtml("Part Group Summary — " + latestLabel + " (all groups)",
      ["Part Group","Part No","Inventory Value","% of Value","Dead Stock Value","Dead Stock %"],
      pgStats.map(x => [escapeHtml(x.g), x.n.toLocaleString("id-ID"), fmtRp(x.val),
        pgTotalVal ? (x.val/pgTotalVal*100).toFixed(1)+"%" : "-", fmtRp(x.dead), x.val ? Math.round(x.dead/x.val*100)+"%" : "-"]))}
    ${tableHtml("Inventory Status per Branch — " + latestLabel,
      ["Branch","Dead Stock","Slow","Medium","Fast","Total"],
      (() => {
        // Persen = nilai status ÷ total stok cabang itu (baris "All Branches" = gabungan seluruh cabang)
        const STAT = ["DEAD STOCK","SLOW","MEDIUM","FAST"];
        const mk = (label, c) => {
          const total = allCats.reduce((a,cat)=>a+(c[cat]||0),0);
          return [label].concat(STAT.map(k => {
            const v = c[k]||0;
            return alignedCell(fmtRp(v), total ? Math.round(v/total*100)+"%" : "-", 2.4);
          }), [fmtRp(total)]);
        };
        const rowsOut = branches.map(b => { const r = mk(escapeHtml(b), branchCatValue[b]); return r; });
        const all = {}; allCats.forEach(cat => { all[cat] = branches.reduce((a,b)=>a+(branchCatValue[b][cat]||0),0); });
        const allRow = mk("<strong>All Branches</strong>", all).map((cell,i) => i===0 ? cell : "<strong>"+cell+"</strong>");
        rowsOut.push(allRow);
        return rowsOut;
      })())}
    <div class="charts-row">

    ${(() => {

      if(!allDead.length) return html;
      const head = `<div class="card-title-row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
        <div class="card-title" style="margin:0;">${escapeHtml(deadTitle)}</div>
        <button class="btn" id="profile-export-dead" style="padding:6px 12px;font-size:12px;">⬇️ Export Excel — All Dead Stock (${allDead.length.toLocaleString("id-ID")} rows)</button>
      </div>`;
      return html.replace('<div class="card-title">' + escapeHtml(deadTitle) + '</div>', () => head);

    <div class="empty-note">Catatan: KPI, chart kategori, breakdown per cabang, dan tabel Dead Stock di atas hanya untuk bulan terbaru (tidak dijumlah dari semua bulan). Filter Tanggal tidak berlaku di halaman ini — gunakan chart tren untuk melihat pergerakan antar bulan.</div>
  `;
  const exportDeadBtn = document.getElementById("profile-export-dead");
  if(exportDeadBtn) exportDeadBtn.addEventListener("click", () => {

    allDead.forEach(r => rowsX.push([r.branch, r.partNo, r.desc, r.partGroup, String(r.model==null?"":r.model).trim(), toNum(r.inStock), toNum(r.rollOut12m),

    rowsX.push(["TOTAL","","","","", allDead.reduce((a,r)=>a+toNum(r.inStock),0),"","","","","","", allDead.reduce((a,r)=>a+toNum(r.totalValue),0), ""]);
    ctDownloadExcel("Dead_Stock_Parts_" + currentCompany + "_" + latestLabel.replace(/\s+/g,"-") + ".xlsx", "Dead Stock", rowsX);
  });
  drawPie("chart-profile-value", catOrder, catOrder.map(c=>valueByCategory[c]||0), catOrder.map(c=>CAT_COLORS[c]));

function parseServiceCallDate(s){
  if(!s) return null;
  // Kolom Start Date sekarang bisa berupa tanggal asli (Date object dari backend)...
  if(s instanceof Date && !isNaN(s)) return s;
  if(typeof s !== "string") return null;
  // ...atau masih format teks lama "dd.mm.yy"
  const m = s.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);
  if(m) return new Date(2000+Number(m[3]), Number(m[2])-1, Number(m[1]));
  // fallback: coba parse langsung kalau formatnya string tanggal umum (mis. "2 Jan 2025")
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function buildServiceCallRowsRaw(s){

function agingBucketLabel(days){
  if(days < 30) return "Aging < 30 Days";
  if(days < 60) return "Aging 30 - 60 Days";
  if(days < 90) return "Aging 60 - 90 Days";
  if(days < 120) return "Aging 90 - 120 Days";
  return "Aging > 120 Days";
}
const AGING_BUCKETS = ["Aging < 30 Days","Aging 30 - 60 Days","Aging 60 - 90 Days","Aging 90 - 120 Days","Aging > 120 Days"];

/* Kategori Status Unit di Machine Population — kolom "STATUS" (ditambahkan user 2026-10-01,
   sebelumnya tab ini cuma berisi unit aktif). Kosong/"Active" dianggap aktif; "Scrap"/"Unknown"
   dianggap tidak aktif (unitnya sudah discrap, atau keberadaannya tidak diketahui). Teks lain
   yang tidak dikenali sengaja DIANGGAP AKTIF (default aman) supaya tidak diam-diam hilang dari
   hitungan populasi aktif kalau ada variasi penulisan status di sheet. */
function unitStatusCategory(status){
  const s = String(status||"").trim().toUpperCase();
  if(!s || s === "ACTIVE") return "active";
  if(s.startsWith("SCRAP")) return "scrap";
  if(s.startsWith("UNKNOWN")) return "unknown";
  return "active";
}
/* Tabel unit dengan kotak pencarian (SN Unit / SN Engine / Customer / Model).
   Pencarian menyaring SEMUA unit pada kelompoknya (bukan hanya baris yang tampil default). */
const UNIT_SEARCH_MAX = 100;
function unitSearchTableHtml(id, title, columns, defaultLimit){
  const thead = columns.map(c => `<th>${escapeHtml(c)}</th>`).join("");
  return `<div class="card-shell" id="${id}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
      <div class="card-title" style="margin:0;">${escapeHtml(title)}</div>
      <input type="search" id="${id}-q" placeholder="Cari SN Unit / SN Engine / Customer / Model…" autocomplete="off"
        style="min-width:280px;max-width:100%;padding:7px 10px;border:1px solid var(--line, #d9d2c3);border-radius:8px;font:inherit;font-size:13px;background:#fff;color:inherit;" />
    </div>
    <div class="note-text" id="${id}-info" style="margin-bottom:6px;"></div>
    <div class="table-scroll"><table class="ast-table"><thead><tr>${thead}</tr></thead><tbody id="${id}-body"></tbody></table></div>
  </div>`;
}
function wireUnitSearch(id, items, rowFn, defaultLimit, colCount){
  const q = document.getElementById(id + "-q"), body = document.getElementById(id + "-body"), info = document.getElementById(id + "-info");
  if(!q || !body) return;
  const hay = items.map(r => [r.snUnit, r.snEngine, r.customer, r.model].map(x => String(x == null ? "" : x).toLowerCase()).join(" | "));
  const draw = () => {
    const term = q.value.trim().toLowerCase();
    let idx;
    if(term){
      const words = term.split(/\s+/).filter(Boolean);
      idx = []; hay.forEach((h, i) => { if(words.every(w => h.indexOf(w) >= 0)) idx.push(i); });
    }else{
      idx = items.slice(0, defaultLimit).map((_, i) => i);
    }
    const total = term ? idx.length : items.length;
    const shown = idx.slice(0, term ? UNIT_SEARCH_MAX : defaultLimit);
    body.innerHTML = shown.length

      : `<tr><td colspan="${colCount}"><div class="empty-note">${term ? "Tidak ada unit yang cocok dengan pencarian." : "Belum ada data pada rentang ini."}</div></td></tr>`;
    info.textContent = term
      ? `Menemukan ${total.toLocaleString("id-ID")} unit` + (total > shown.length ? ` — menampilkan ${shown.length} pertama, persempit kata kunci.` : ".")
      : `Menampilkan ${shown.length.toLocaleString("id-ID")} dari ${items.length.toLocaleString("id-ID")} unit — ketik di kotak pencarian untuk mencari di seluruh unit.`;
  };
  q.addEventListener("input", draw);
  draw();
}

/* ============================================================== *
 *  CUSTOMER TREND — Trend Pembelian & Quotation per Customer,      *
 *  disandingkan dengan Populasi Mesin & Group (dari sheet          *
 *  Machine_Population). Sengaja TIDAK ikut filter tanggal global   *
 *  (Dari/Sampai) karena butuh histori multi-tahun penuh — hanya    *
 *  ikut filter Company & Cabang, sama seperti pola MTD/YTD/TTM di  *
 *  halaman Invoice.                                                *
 * ============================================================== */

/* Menyamakan nama Customer antar sheet yang formatnya bisa beda
   (mis. "PT ABC JAYA" vs "ABC JAYA, PT") supaya Populasi Mesin &
   Group tetap ketemu meskipun urutan kata/koma-nya berbeda. */
function normalizeCustomerKey(name){
  let v = String(name||"").toUpperCase().trim();
  v = v.replace(/[,.]/g, " "); // koma & titik dianggap pemisah — "SETIA. PT" = "SETIA, PT" = "SETIA PT"
  v = v.replace(/\b(PT|CV|TBK|PERSERO)\b/g, " ");
  v = v.replace(/\s+/g, " ").trim();
  return v;
}

/* ============================================================== *
 *  CUSTOMER ALIAS — penyatuan nama Customer lama/baru (rename,     *
 *  merger/akuisisi). Dibaca dari tab "Customer Alias" (kolom A =   *
 *  Nama Lama persis seperti di sheet transaksi, B = Nama Baru),    *
 *  diterapkan ke SEMUA sumber (Quotation/Invoice/Population/Parts  *
 *  Delivery) sebelum dikelompokkan per Customer, supaya rename     *
 *  tidak kebaca seolah-olah "Customer lama berhenti, Customer baru *
 *  muncul". Data transaksi mentah di sheet TIDAK diubah — cuma     *
 *  nama yang dipakai dashboard untuk mengelompokkan. Mendukung     *
 *  rantai rename (A→B→C, bisa sampai beberapa kali ganti nama).    *
 * ============================================================== */
function buildCustomerAliasMap(aliasS){
  const raw = rowsToObjects(aliasS, { oldName:0, newName:1 });
  const directMap = {}; // normalizeCustomerKey(Nama Lama) -> Nama Baru (persis seperti ditulis)
  raw.forEach(r => {
    const oldKey = normalizeCustomerKey(r.oldName);
    const newName = String(r.newName||"").trim();
    if(!oldKey || !newName) return;
    directMap[oldKey] = newName;
  });
  // Ikuti rantai rename sampai ketemu nama final — maksimal 10 loncatan (jaga-jaga jauh lebih
  // dari 3x ganti nama) dan deteksi siklus (A→B→A) supaya tidak infinite loop kalau salah input.
  const resolvedMap = {}; // normalizeCustomerKey(Nama Lama ATAU Nama Antara) -> Nama Baru final
  Object.keys(directMap).forEach(key => {
    let current = key, seen = new Set(), finalName = directMap[key];
    for(let i = 0; i < 10; i++){
      if(seen.has(current)) break;
      seen.add(current);
      if(!directMap[current]) break;
      finalName = directMap[current];
      current = normalizeCustomerKey(finalName);
    }
    resolvedMap[key] = finalName;
  });
  return resolvedMap;
}
async function getCustomerAliasMap(){
  try{
    const aliasS = await fetchSheet("customerAlias");
    return buildCustomerAliasMap(aliasS);
  }catch(e){
    return {}; // tab belum ada / belum ada isinya — jalan seperti biasa tanpa alias
  }
}
/* Terapkan resolusi alias ke field tertentu (default "customer") di semua baris, in-place. */
function applyCustomerAlias(rows, aliasMap, field="customer"){
  if(!aliasMap || !Object.keys(aliasMap).length) return rows;
  rows.forEach(r => {
    const key = normalizeCustomerKey(r[field]);
    if(key && aliasMap[key]) r[field] = aliasMap[key];
  });
  return rows;
}

/* ============================================================== *
 *  OPSI A (hasil diskusi 2026-10-06): kepemilikan cabang & kategori *
 *  Customer SELALU dihitung dari data SEMUA cabang, baru kemudian   *
 *  filter Cabang cuma memilih Customer milik cabang tsb. Jadi angka *
 *  saat memilih 1 cabang = angka baris cabang itu di tabel "Semua   *
 *  Cabang" (tidak lagi bergeser karena data cabang lain hilang).    *
 * ============================================================== */
function ctBranchSelected(branch){
  return globalFilters.branch === "ALL" || branchMatchesFilter(branch, globalFilters.branch);
}
/* Cabang "pemilik" Customer: AND (unit AKTIF + transaksi di cabang yang sama) diutamakan; kalau
   tidak ada, cabang unit aktifnya saja; fallback OR (cabang manapun ada sinyal) hanya kalau
   Customer tidak punya unit aktif di manapun. Input: SEMUA baris (belum difilter cabang).
   Return { src: branch->key->{name,pop,quo,inv}, ownedByBranch: branch->Set(key) } */
function ctBuildOwnership(quoAll, invAll, popActiveAll){
  const src = {};
  function mark(branch, customer, source){
    const b = String(branch||"").trim();
    const key = normalizeCustomerKey(customer);
    if(!b || !key) return;
    if(!src[b]) src[b] = {};
    if(!src[b][key]) src[b][key] = { name:String(customer).trim(), pop:false, quo:false, inv:false };
    src[b][key][source] = true;
  }
  invAll.forEach(r => mark(r.branch, r.customer, "inv"));
  quoAll.forEach(r => mark(r.branch, r.customer, "quo"));
  popActiveAll.forEach(r => mark(r.branch, r.customer, "pop"));
  const byCustomer = {};
  Object.entries(src).forEach(([branch, inBranch]) => {
    Object.entries(inBranch).forEach(([key, v]) => {
      if(!byCustomer[key]) byCustomer[key] = [];
      byCustomer[key].push({ branch, ...v });
    });
  });
  const ownedByBranch = {};
  Object.entries(byCustomer).forEach(([key, entries]) => {
    const qualified = entries.filter(e => e.pop && (e.quo || e.inv));
    const activePop = entries.filter(e => e.pop);
    const finalEntries = qualified.length ? qualified : (activePop.length ? activePop : entries);
    finalEntries.forEach(e => {
      if(!ownedByBranch[e.branch]) ownedByBranch[e.branch] = new Set();
      ownedByBranch[e.branch].add(key);
    });
  });
  return { src, ownedByBranch };
}
/* Aktivitas Customer secara GLOBAL (semua cabang): key -> { txYTD, txEver, activeUnits }.
   Hanya Customer yang punya baris transaksi ATAU unit aktif yang masuk peta ini. */
function ctGlobalActivity(quoAll, invAll, popAll){
  const now = new Date(), y = now.getFullYear();
  const m = {};
  const get = k => (m[k] = m[k] || { txYTD:false, txEver:false, activeUnits:0 });
  [quoAll, invAll].forEach(rows => rows.forEach(r => {
    const k = normalizeCustomerKey(r.customer);
    if(!k || !(r.date instanceof Date) || isNaN(r.date)) return;
    const a = get(k);
    a.txEver = true;
    if(r.date.getFullYear() === y && r.date <= now) a.txYTD = true;
  }));
  popAll.forEach(r => {
    if(unitStatusCategory(r.status) !== "active") return;
    const k = normalizeCustomerKey(r.customer);
    if(k) get(k).activeUnits += 1;
  });
  return m;
}

function ctFilterBranch(rows){
  if(globalFilters.branch === "ALL") return rows;
  return rows.filter(r => branchMatchesFilter(r.branch, globalFilters.branch));
}

/* Jumlah nilai dari sekumpulan baris pada satu tahun tertentu, opsional
   dibatasi sampai tanggal (bulan/hari) tertentu saja — dipakai supaya
   perbandingan tahun berjalan (YTD) vs tahun lalu adil (periode sama),
   bukan tahun berjalan vs tahun lalu penuh. */
function ctSumToDate(rowsRaw, year, cutoffMonth, cutoffDay){
  return rowsRaw.filter(r => {
    if(!(r.date instanceof Date) || isNaN(r.date)) return false;
    if(r.date.getFullYear() !== year) return false;
    if(cutoffMonth == null) return true;
    const m = r.date.getMonth(), d = r.date.getDate();
    return (m < cutoffMonth) || (m === cutoffMonth && d <= cutoffDay);
  }).reduce((a,r)=>a+toNum(r.value),0);
}

/* Batas "Stabil" — perubahan dalam rentang ±8% dianggap stabil, di luar
   itu baru dihitung Naik/Turun. */
const CT_STABLE_BAND = 0.08;

/* Klasifikasi arah trend (Naik/Turun/Stabil/Baru/Berhenti/Belum Pernah)
   dari perbandingan periode-yang-sama (lihat ctSumToDate di atas). */
function ctClassify(hadEarlier, thisYTD, lastYTD){
  // Tidak pernah ada transaksi sama sekali sejak awal data — beda dari
  // "Lapsed" (yang pernah ada transaksi lalu berhenti), ini butuh
  // perhatian tersendiri jadi jangan ikut dianggap "Stabil".
  if(thisYTD === 0 && lastYTD === 0 && !hadEarlier) return "none";
  // Sekarang nihil, padahal pernah ada transaksi (tahun lalu atau lebih awal)
  if(thisYTD === 0 && (lastYTD > 0 || hadEarlier)) return "stop";
  // Baru pertama kali muncul tahun ini, tidak ada histori sebelumnya
  if(!hadEarlier && thisYTD > 0) return "new";
  // Periode yang sama tahun lalu nihil, sekarang ada lagi — dihitung Naik
  if(lastYTD === 0) return "up";
  const pct = (thisYTD - lastYTD) / lastYTD;
  if(Math.abs(pct) <= CT_STABLE_BAND) return "stable";
  return pct > 0 ? "up" : "down";
}

/* Total Customer (definisi baru, hasil diskusi 2026-10-05) = Aktif + Lapsed + Prospect =
   Customer yang (a) punya minimal 1 unit AKTIF di Machine Population, ATAU (b) masih transaksi
   tahun ini (Quotation/Invoice, s.d. hari ini). Customer yang sudah berhenti beli DAN tidak
   punya unit aktif ("Inactive") tidak dihitung. Parameter = SEMUA baris (belum difilter
   cabang); filter cabang diterapkan di dalam lewat kepemilikan cabang (Opsi A). Dipakai di Dashboard Home & Machine
   Population supaya angkanya sama dengan Customer Trend. Semua input harus sudah melewati
   applyCustomerAlias & filter cabang oleh pemanggil. */
function ctTotalCustomerKeys(quoAll, invAll, popAll){
  const gAct = ctGlobalActivity(quoAll, invAll, popAll);
  let keys = Object.keys(gAct).filter(k => ctActivityCategory(gAct[k].txYTD, gAct[k].txEver, gAct[k].activeUnits) !== "inactive");
  if(globalFilters.branch !== "ALL"){
    const popActive = popAll.filter(r => unitStatusCategory(r.status) === "active");
    const { ownedByBranch } = ctBuildOwnership(quoAll, invAll, popActive);
    const owned = new Set();
    Object.entries(ownedByBranch).forEach(([b, set]) => { if(ctBranchSelected(b)) set.forEach(k => owned.add(k)); });
    keys = keys.filter(k => owned.has(k));
  }
  return new Set(keys);
}

/* Kategori Aktivitas Customer (3 tingkat, "Opsi B" hasil diskusi 2026-10-01) — beda dari
   c.status/c.quoStatus (yang masing-masing cuma lihat Invoice atau Quotation sendiri-sendiri):
   - "active"   = MASIH transaksi tahun ini (ada baris Invoice ATAU Quotation s.d. hari ini).
   - "prospect" = punya unit aktif (Machine Population) tapi BELUM PERNAH ada baris Quotation
                  maupun Invoice sama sekali sejak awal data.
   - "churned"  = sisanya — pernah ada Quotation dan/atau Invoice di masa lalu, tapi sekarang
                  sudah tidak ada aktivitas sama sekali ("stop" di salah satu/kedua-duanya,
                  tidak ada yang masih berjalan). */
function ctActivityCategory(hasTxYTD, hasTxEver, activeUnits){
  // Berbasis ADA/TIDAKNYA baris transaksi (Quotation/Invoice), BUKAN nilai rupiahnya — baris
  // bernilai 0 / retur / credit note tetap dihitung "ada transaksi". Dulu pakai status berbasis
  // nilai (none/stop/up/...) sehingga Customer yang transaksinya net 0 salah kebaca "Prospect"
  // walau tidak punya unit aktif, dan Total Customer Trend jadi lebih besar dari halaman lain
  // (hasil review 2026-10-05: 580 vs 568).
  if(!hasTxEver) return "prospect";
  if(hasTxYTD) return "active";
  // Sudah berhenti transaksi: "churned" (Lapsed) kalau MASIH punya unit aktif (masih bisa
  // di-follow up), "inactive" (Tidak Aktif) kalau tidak punya unit aktif sama sekali — unit
  // Scrap/Unknown semua, atau memang tidak ada di Machine Population (hasil diskusi 2026-10-05).
  // "inactive" TIDAK dihitung di Total Customer.
  return activeUnits > 0 ? "churned" : "inactive";
}
const CT_ACTIVITY_BADGE = {
  active:   '<span class="badge badge-up">✅ Active</span>',
  churned:  '<span class="badge badge-down">🛑 Lapsed</span>',
  inactive: '<span class="badge badge-stop">💤 Inactive</span>',
  prospect: '<span class="badge badge-none">🎯 Prospect</span>',
};
const CT_ACTIVITY_LABEL = { active: "Active (Still Transacting)", churned: "Lapsed (Still Has Active Units)", inactive: "Inactive (Lapsed & No Active Units)", prospect: "Prospect (Never Purchased)" };

/* Tren jangka panjang: hitung berapa tahun BERTURUT-TURUT nilainya
   turun/naik, mundur dari tahun terbaru ke belakang (mis. 2023→2024→
   2025→2026 turun terus = streak 3, melibatkan 4 tahun). Ini pelengkap
   ctClassify (yang cuma bandingkan 2 periode terakhir) supaya tren
   penurunan/kenaikan yang sudah berlangsung beberapa tahun tetap
   kelihatan di Catatan Otomatis. */
function ctLongTermTrend(yearMap, years){
  let dir = null, streak = 0;
  for(let i = years.length - 1; i > 0; i--){
    const cur = yearMap[years[i]], prev = yearMap[years[i-1]];
    let d = cur > prev ? "up" : (cur < prev ? "down" : "flat");
    if(dir === null){
      if(d === "flat") break;
      dir = d; streak = 1;
    } else if(d === dir){
      streak++;
    } else break;
  }
  return { dir, streak, years: years.slice(years.length - (streak+1)) };
}
