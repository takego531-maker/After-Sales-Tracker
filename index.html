};
const CT_STATUS_TEXT = {
  up: "Up", down: "Down", stable: "Stable", stop: "Invoice Stopped", new: "New", none: "Never Purchased",
};

/* Growth since tahun pertama data tersedia (basis Jan-bulan berjalan, konsisten
   dengan kolom tahun lainnya) — pelengkap Status (yang cuma lihat 2 tahun terakhir),
   supaya kelihatan gambaran besar sejak awal tracking. */
function ctGrowthSince(yearMap, years){
  if(years.length < 2) return null;
  const baseYear = years[0], curYear = years[years.length-1];
  const base = yearMap[baseYear], cur = yearMap[curYear];
  const pct = base > 0 ? ((cur - base) / base) * 100 : null;
  return { baseYear, curYear, base, cur, pct };
}
function ctGrowthCell(g){
  if(!g) return `<td style="text-align:right"><span style="color:var(--ink-soft)">-</span></td>`;
  if(g.pct === null){
    if(g.cur === 0 && g.base === 0) return `<td style="text-align:right"><span style="color:var(--ink-soft)">-</span></td>`;
    return `<td style="text-align:right"><span class="badge badge-new badge-sm">🆕 Belum ada di ${g.baseYear}</span><br>
      <span style="font-size:9.5px;color:var(--ink-soft);font-weight:400;">${fmtRpShort(g.base)} → ${fmtRpShort(g.cur)}</span></td>`;
  }
  const color = g.pct > 0 ? 'var(--good)' : (g.pct < 0 ? 'var(--bad)' : 'var(--ink-soft)');
  const sign = g.pct > 0 ? '+' : '';
  return `<td style="text-align:right"><span style="color:${color};font-weight:600;">${sign}${Math.round(g.pct)}%</span><br>
    <span style="font-size:9.5px;color:var(--ink-soft);font-weight:400;">${fmtRpShort(g.base)} → ${fmtRpShort(g.cur)}</span></td>`;
}
function ctGrowthPctForSort(g){
  if(!g) return -Infinity;
  if(g.pct === null) return g.cur > 0 ? 99999 : -Infinity;
  return g.pct;
}
/* ---- Export tabel ke file Excel (.xlsx) asli, pakai library SheetJS ---- */
function ctCsvEsc(v){
  const s = String(v==null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function ctDownloadCSV(filename, rows){
  // fallback kalau library Excel gagal dimuat (mis. koneksi internet ke CDN diblokir)
  const csv = rows.map(r => r.map(ctCsvEsc).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function ctDownloadExcel(filename, sheetName, rows){
  if(typeof XLSX === "undefined"){
    alert("Library Excel belum siap dimuat (mungkin koneksi internet lambat). File akan diunduh sebagai CSV sebagai gantinya — silakan coba lagi beberapa saat untuk mendapat file Excel (.xlsx).");
    ctDownloadCSV(filename.replace(/\.xlsx$/i, ".csv"), rows);
    return;
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const colWidths = rows[0].map((_, colIdx) => {
    let maxLen = 8;
    rows.forEach(r => { const len = String(r[colIdx] == null ? "" : r[colIdx]).length; if(len > maxLen) maxLen = len; });
    return { wch: Math.min(maxLen + 2, 60) };
  });
  ws["!cols"] = colWidths;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

function ctBuildNote(invStatus, quoStatus){
  if(invStatus === "none" && quoStatus === "none")
    return { text: "Belum pernah ada Quotation maupun Invoice sejak awal data — perlu ditindaklanjuti kenapa customer ini belum pernah bertransaksi.", flag: true };
  if(invStatus === "none")
    return { text: "Belum pernah ada Invoice sama sekali, meski ada Quotation — perlu ditindaklanjuti prosesnya.", flag: true };
  if(invStatus === "stop" && quoStatus !== "stop" && quoStatus !== "none")
    return { text: "Tidak ada Invoice tahun ini, padahal Quotation masih ada — belum ada yang closing.", flag: true };
  if(invStatus === "stop" && (quoStatus === "stop" || quoStatus === "none"))
    return { text: "Sudah tidak ada aktivitas Quotation maupun Invoice sama sekali.", flag: true };
  if(invStatus === "down" && quoStatus === "up")
    return { text: "Quotation naik tapi Invoice turun — win rate kemungkinan menurun, perlu dicek proses follow-up-nya.", flag: true };
  if(invStatus === "down" && (quoStatus === "down" || quoStatus === "stable"))
    return { text: "Quotation & Invoice sama-sama turun.", flag: false };
  if(invStatus === "down" && (quoStatus === "stop" || quoStatus === "none"))
    return { text: "Invoice turun dan sudah tidak ada Quotation baru — aktivitas ke customer ini menurun.", flag: true };
  if(invStatus === "up" && (quoStatus === "up" || quoStatus === "stable"))
    return { text: "Quotation & Invoice sama-sama naik / terjaga.", flag: false };
  if(invStatus === "up" && (quoStatus === "down" || quoStatus === "stop" || quoStatus === "none"))
    return { text: "Invoice naik walau Quotation turun/tidak ada — kemungkinan order langsung tanpa lewat Quotation.", flag: false };
  if(invStatus === "new")
    return { text: "Customer baru mulai membeli tahun ini.", flag: false };
  if(invStatus === "stable")
    return { text: "Relatif stabil dibanding periode yang sama tahun lalu (selisih dalam ±8%).", flag: false };
  return { text: "-", flag: false };
}

/* Tambahkan info tren jangka panjang (turun/naik beberapa tahun
   berturut-turut, dari 2023 s/d sekarang) ke Catatan Otomatis yang
   sudah ada — pelengkap perbandingan 2-periode-terakhir di atas. */
function ctAppendLongTermTrend(note, invoiceYearMap, quotationYearMap, years){
  const ltInv = ctLongTermTrend(invoiceYearMap, years);
  const ltQuo = ctLongTermTrend(quotationYearMap, years);
  let extra = "";
  if(ltInv.dir === "down" && ltInv.streak >= 2){
    extra += ` ⚠️ Invoice turun ${ltInv.streak+1} tahun berturut-turut (${ltInv.years.join("→")}).`;
  } else if(ltInv.dir === "up" && ltInv.streak >= 2){
    extra += ` ✅ Invoice naik ${ltInv.streak+1} tahun berturut-turut (${ltInv.years.join("→")}).`;
  }
  if(ltQuo.dir === "down" && ltQuo.streak >= 2){
    extra += ` ⚠️ Quotation turun ${ltQuo.streak+1} tahun berturut-turut (${ltQuo.years.join("→")}).`;
  } else if(ltQuo.dir === "up" && ltQuo.streak >= 2){
    extra += ` ✅ Quotation naik ${ltQuo.streak+1} tahun berturut-turut (${ltQuo.years.join("→")}).`;
  }
  if(!extra) return note;
  return { text: (note.text === "-" ? "" : note.text) + extra, flag: note.flag || extra.includes("⚠️") };
}

async function renderCustomerTrend(){
  const [quoS, invS, popS, aliasMap] = await Promise.all([
    fetchSheet("quotations"), fetchSheet("invoices"), fetchSheet("population"), getCustomerAliasMap(),
  ]);

  let quoRows = rowsToObjects(quoS, { no:0, date:1, customer:2, branch:7, value:12 });
  quoRows = quoRows.filter(r => r.no || r.date instanceof Date);
  let invRows = rowsToObjects(invS, { branch:0, invoice:1, date:2, customer:3, value:7, division:9 });
  invRows = invRows.filter(r => r.invoice || r.date instanceof Date);

  if(currentCompany === "IKE" && quoRows.length === 0 && invRows.length === 0){
    pageBody.innerHTML = noIkeDataBanner("Customer Trend"); return;
  }

  quoRows.forEach(r => { r.value = toNum(r.value) / 1.11; }); // nilai di sheet termasuk PPN 11%
  invRows.forEach(r => { r.value = toNum(r.value); });
  // Samakan nama Customer yang pernah rename/merger (tab "Customer Alias") SEBELUM apapun
  // dikelompokkan, supaya history lama & baru digabung jadi 1 Customer, bukan kebaca "berhenti"
  // + "customer baru" yang sebetulnya orang yang sama.
  applyCustomerAlias(quoRows, aliasMap);
  applyCustomerAlias(invRows, aliasMap);
  const quoAll = quoRows, invAll = invRows; // SEMUA cabang — untuk kepemilikan & kategori (Opsi A)
  quoRows = ctFilterBranch(quoRows);
  invRows = ctFilterBranch(invRows);

  let popRows = rowsToObjects(popS, { customer:7, group:8, branch:6, snUnit:3, status:15, remarks:14 });
  popRows = popRows.filter(r => r.snUnit);
  applyCustomerAlias(popRows, aliasMap);
  popRows.forEach(r => { r.statusCat = unitStatusCategory(r.status); });
  const popAll = popRows;
  popRows = ctFilterBranch(popRows);
  // population = jumlah unit AKTIF saja (dipakai utk Rata-rata Beli Parts/Unit, supaya tidak
  // bias dibagi unit yang sudah Scrap/Unknown). Unit tidak aktif tetap dicatat terpisah
  // (populationInactive + inactiveUnits) supaya kelihatan di catatan/detail Customer kenapa dia
  // "Lapsed" — kemungkinan karena unitnya sudah tidak ada, bukan semata churn.
  const popByKey = {};
  popRows.forEach(r => {
    const key = normalizeCustomerKey(r.customer);
    if(!key) return;
    if(!popByKey[key]) popByKey[key] = { population: 0, populationInactive: 0, inactiveUnits: [], group: "", name: String(r.customer).trim() };
    if(r.statusCat === "active"){
      popByKey[key].population += 1;
    }else{
      popByKey[key].populationInactive += 1;
      popByKey[key].inactiveUnits.push({ snUnit: r.snUnit, statusCat: r.statusCat, remarks: r.remarks });
    }
    if(!popByKey[key].group && r.group) popByKey[key].group = String(r.group).trim();
  });

  // Rekap Jumlah Customer per Cabang — dihitung dari Customer unik yang muncul di Quotation,
  // Invoice, ATAU Machine Population pada cabang tsb (1 Customer bisa dihitung di lebih dari 1
  // cabang kalau memang bertransaksi di beberapa cabang — konsisten dengan tabel Resume per
  // Cabang di halaman lain). Sudah ikut filter Cabang global lewat ctFilterBranch di atas.
  // Status Aktif/Tidak Aktif per Customer baru tersedia setelah stats dihitung di bawah, jadi
  // rekap per-cabangnya (branchCustomerCounts) disusun belakangan setelah customerList siap.
  // Kepemilikan cabang dihitung dari data SEMUA cabang (Opsi A), lalu dibatasi ke cabang yang
  // sedang dipilih di filter. Aturannya: AND (unit aktif + transaksi di cabang yang sama)
  // diutamakan; kalau tidak ada, cabang unit aktifnya saja; fallback OR hanya kalau Customer tidak
  // punya unit aktif di manapun (lihat ctBuildOwnership).
  const ownership = ctBuildOwnership(quoAll, invAll, popAll.filter(r => r.statusCat === "active"));
  // DARI MANA tiap Customer per Cabang berasal (Quotation/Invoice/Population) — untuk breakdown
  // "kenapa Total Customer > Machine Population" di UI (klik baris cabang).
  const branchSourceMap = ownership.src;
  const customersByBranch = {};
  Object.entries(ownership.ownedByBranch).forEach(([b, set]) => { if(ctBranchSelected(b)) customersByBranch[b] = set; });
  const ownedKeysSelected = globalFilters.branch === "ALL" ? null : (() => {
    const u = new Set(); Object.values(customersByBranch).forEach(set => set.forEach(k => u.add(k))); return u;
  })();
  const globalActivity = ctGlobalActivity(quoAll, invAll, popAll);

  const now = new Date();
  const currentYear = now.getFullYear();
  const todayMonth = now.getMonth(), todayDay = now.getDate();
  const allDates = [...quoRows.map(r=>r.date), ...invRows.map(r=>r.date)].filter(d => d instanceof Date && !isNaN(d));
  const minYear = allDates.length ? Math.min(currentYear, ...allDates.map(d=>d.getFullYear())) : currentYear;
  const YEARS = [];
  for(let y = minYear; y <= currentYear; y++) YEARS.push(y);

  function emptyYearMap(){ const o = {}; YEARS.forEach(y => o[y] = 0); return o; }

  const monthLabel = fmtMonthShortId(todayMonth);
  let ctMainListCache = [];

  const customers = {};
  // Dikelompokkan per KUNCI TERNORMALISASI (normalizeCustomerKey), bukan nama mentah — supaya
  // variasi penulisan nama yang sama ("ABC, PT" / "PT ABC" / "abc") jadi 1 Customer, bukan
  // beberapa baris terpisah yang membuat Total Customer lebih besar dari halaman lain
  // (hasil review 2026-10-05: 580 vs 568). Nama yang ditampilkan = penulisan yang pertama ketemu.
  function getCustomer(name){
    const ck = normalizeCustomerKey(name);
    if(!customers[ck]) customers[ck] = {
      name, invoice: emptyYearMap(), quotation: emptyYearMap(), quoteCount: emptyYearMap(),
      invoiceYTD: emptyYearMap(), quotationYTD: emptyYearMap(),
      invRowsRaw: [], quoRowsRaw: [], partsInvoiceTotal: 0,
    };
    return customers[ck];
  }
  invRows.forEach(r => {
    if(!r.customer || !(r.date instanceof Date) || isNaN(r.date)) return;
    const y = r.date.getFullYear();
    if(y < minYear || y > currentYear) return;
    const c = getCustomer(String(r.customer).trim());
    c.invoice[y] += toNum(r.value);
    c.invRowsRaw.push(r);
    // Total Invoice Divisi Parts sejak awal data (dipakai utk kolom Rata-rata Pembelian Spare Parts/Unit)
    if(String(r.division||"").trim() === "Parts") c.partsInvoiceTotal += toNum(r.value);
  });
  quoRows.forEach(r => {
    if(!r.customer || !(r.date instanceof Date) || isNaN(r.date)) return;
    const y = r.date.getFullYear();
    if(y < minYear || y > currentYear) return;
    const c = getCustomer(String(r.customer).trim());
    c.quotation[y] += toNum(r.value);
    c.quoteCount[y] += 1;
    c.quoRowsRaw.push(r);
  });

  // Customer yang punya mesin AKTIF (Machine Population) tapi belum pernah Quotation/Invoice
  // sejak awal data (${minYear}) tetap dimasukkan ke tabel — statusnya nanti otomatis
  // "⚠️ Never Purchased" (Prospect) — supaya "Total Customer" mencerminkan semua Customer
  // yang diketahui (Quotation + Invoice + Machine Population AKTIF), bukan cuma yang pernah
  // transaksi. Customer yang population-nya cuma Scrap/Unknown (tidak ada unit aktif sama
  // sekali) DAN tidak pernah transaksi TIDAK dimasukkan — bukan Customer aktual lagi, jangan
  // ikut dihitung sebagai Prospect (hasil diskusi 2026-10-02, kasus Widya Sapta Colas).
  const existingCustomerKeys = new Set(Object.values(customers).map(c => normalizeCustomerKey(c.name)));
  Object.keys(popByKey).forEach(key => {
    if(existingCustomerKeys.has(key)) return;
    if(popByKey[key].population <= 0) return; // tidak ada unit aktif & tidak pernah transaksi
    const nm = popByKey[key].name;
    if(!nm) return;
    getCustomer(nm);
  });

  // Filter cabang aktif: buang Customer yang BUKAN milik cabang terpilih (mis. cuma numpang
  // transaksi di cabang ini, unit aktifnya di cabang lain) — Opsi A.
  if(ownedKeysSelected) Object.keys(customers).forEach(k => { if(!ownedKeysSelected.has(k)) delete customers[k]; });

  Object.values(customers).forEach(c => {
    const key = normalizeCustomerKey(c.name);
    const pop = popByKey[key];
    c.population = pop ? pop.population : 0;
    c.populationInactive = pop ? pop.populationInactive : 0;
    c.inactiveUnits = pop ? pop.inactiveUnits : [];
    c.group = (pop && pop.group) ? pop.group : "(No Group)";

    // Basis "s.d. bulan berjalan" (Jan-${monthLabel}) diterapkan SAMA RATA ke semua tahun
    // (bukan cuma tahun terakhir) supaya semua kolom di tabel apple-to-apple satu sama lain.
    // Total 1 tahun penuh tetap disimpan di c.invoice/c.quotation untuk referensi di detail.
    YEARS.forEach(y => {
      c.invoiceYTD[y] = ctSumToDate(c.invRowsRaw, y, todayMonth, todayDay);
      c.quotationYTD[y] = ctSumToDate(c.quoRowsRaw, y, todayMonth, todayDay);
    });
    c.thisYTDInv = ctSumToDate(c.invRowsRaw, currentYear, todayMonth, todayDay);
    c.lastYTDInv = ctSumToDate(c.invRowsRaw, currentYear-1, todayMonth, todayDay);
    c.thisYTDQuo = ctSumToDate(c.quoRowsRaw, currentYear, todayMonth, todayDay);
    c.lastYTDQuo = ctSumToDate(c.quoRowsRaw, currentYear-1, todayMonth, todayDay);
    c.hadEarlierInv = YEARS.filter(y => y < currentYear).some(y => c.invoice[y] > 0);
    c.hadEarlierQuo = YEARS.filter(y => y < currentYear).some(y => c.quotation[y] > 0);

    c.status = ctClassify(c.hadEarlierInv, c.thisYTDInv, c.lastYTDInv);
    c.quoStatus = ctClassify(c.hadEarlierQuo, c.thisYTDQuo, c.lastYTDQuo);
    // Kategori Aktivitas dihitung GLOBAL (semua cabang) — Customer yang aktif bertransaksi di
    // cabang manapun dihitung Aktif; unit aktif juga dihitung dari semua cabang (Opsi A).
    const g = globalActivity[key] || { txYTD:false, txEver:false, activeUnits:0 };
    c.activityCat = ctActivityCategory(g.txYTD, g.txEver, g.activeUnits);
    c.note = ctBuildNote(c.status, c.quoStatus);
    c.note = ctAppendLongTermTrend(c.note, c.invoiceYTD, c.quotationYTD, YEARS);
    if(c.activityCat === "inactive"){
      c.note = { text: c.note.text + (c.populationInactive > 0
        ? ` Tidak dihitung di Total Customer: semua unitnya (${c.populationInactive}) sudah Scrap/Unknown.`
        : ` Tidak dihitung di Total Customer: tidak punya unit di Machine Population.`), flag: true };
    }
    // Kalau Customer turun/berhenti DAN punya unit Scrap/Unknown di Machine Population,
    // tambahkan dugaan penyebabnya langsung di Catatan Otomatis (hasil diskusi 2026-10-01).
    if((c.status === "down" || c.status === "stop") && c.populationInactive > 0){
      const scrapN = c.inactiveUnits.filter(u => u.statusCat === "scrap").length;
      const unknownN = c.inactiveUnits.filter(u => u.statusCat === "unknown").length;
      const bits = [];
      if(scrapN) bits.push(`${scrapN} unit Scrap`);
      if(unknownN) bits.push(`${unknownN} unit Unknown`);
      c.note = { text: c.note.text + ` Kemungkinan terkait ${bits.join(" & ")} di Machine Population — cek detail unit di bawah.`, flag: true };
    }
    c.growth = ctGrowthSince(c.invoiceYTD, YEARS);
    // Rata-rata Pembelian Spare Parts per Unit = Total Invoice Divisi Parts sejak ${minYear} ÷
    // Jumlah Unit (Populasi Mesin). null kalau Customer tidak punya unit tercatat (tidak
    // bisa dihitung per-unit-nya).
    c.avgPartsPerUnit = c.population > 0 ? c.partsInvoiceTotal / c.population : null;
  });

  const customerList = Object.values(customers).sort((a,b) => a.name.localeCompare(b.name));

  // Rekap Jumlah Customer per Cabang, dipecah 3 kategori Aktivitas (Aktif/Churned/Prospect) —
  // pakai c.activityCat yang sama dengan breakdown di KPI atas, supaya kedua angka ini selalu
  // konsisten satu sama lain. Cabang "pemilik" tiap Customer sendiri sudah ditentukan di atas
  // (AND Populasi+Transaksi, fallback OR) lewat customersByBranch.
  const customerByNormKey = {};
  customerList.forEach(c => { customerByNormKey[normalizeCustomerKey(c.name)] = c; });
  const branchCustomerCounts = Object.entries(customersByBranch).map(([branch, set]) => {
    let active = 0, churned = 0, prospect = 0, inactive = 0;
    set.forEach(key => {
      const c = customerByNormKey[key];
      if(!c) return; // bukan Customer aktual (tidak ada unit aktif & tidak pernah transaksi) — jangan dihitung
      if(c.activityCat === "active") active++;
      else if(c.activityCat === "churned") churned++;
      else if(c.activityCat === "inactive") inactive++; // tidak masuk Total Customer
      else prospect++;
    });
    return { branch, active, churned, prospect, inactive, total: active + churned + prospect };
  }).sort((a,b) => b.total - a.total);

  // Breakdown per Cabang: dari Total Customer di atas, mana yang cocok ke Machine Population
  // dan mana yang TIDAK (cuma tercatat lewat Quotation/Invoice) — dipakai buat penjelasan
  // "kenapa Total Customer > jumlah unik di Machine Population" (klik baris cabang di tabel).
  branchCustomerCounts.forEach(b => {
    const set = customersByBranch[b.branch];
    const withPop = [], withoutPop = [];
    set.forEach(key => {
      const c = customerByNormKey[key];
      if(!c || c.activityCat === "inactive") return; // bukan Customer aktual / Tidak Aktif — tidak masuk Total Customer
      const src = (branchSourceMap[b.branch] && branchSourceMap[b.branch][key]) || {};
      const name = c.name || src.name || key;
      const entry = { name, quo: !!src.quo, inv: !!src.inv };
      if(src.pop) withPop.push(entry); else withoutPop.push(entry);
    });
    withPop.sort((a,z) => a.name.localeCompare(z.name));
    withoutPop.sort((a,z) => a.name.localeCompare(z.name));
    b.withPop = withPop;
    b.withoutPop = withoutPop;
  });
  function ctBranchDetailHtml(b){
    const srcLabel = e => [e.quo?"Quotation":null, e.inv?"Invoice":null].filter(Boolean).join(" + ") || "-";
    const rowsWithout = b.withoutPop.map(e => `<tr><td>${escapeHtml(e.name)}</td><td>${srcLabel(e)}</td></tr>`).join("");
    return `<div class="ct-detail-inner">
      <div class="note-text" style="margin-bottom:10px;">
        <strong>${b.withPop.length.toLocaleString("id-ID")}</strong> customer cocok dengan Machine Population ·
        <strong>${b.withoutPop.length.toLocaleString("id-ID")}</strong> customer TIDAK ketemu di Machine Population (cuma tercatat lewat Quotation/Invoice) — cek daftar di bawah, kemungkinan customer baru yang unitnya belum didata, atau beda cara penulisan nama antar sheet.
      </div>
      ${b.withoutPop.length
        ? `<div class="ct-detail-table-wrap" style="max-width:600px;max-height:300px;overflow:auto;">
            <table class="ct-detail-table"><thead><tr><th>Customers (not matched to Machine Population)</th><th>Source</th></tr></thead>
            <tbody>${rowsWithout}</tbody></table></div>`
        : `<div class="empty-note">Semua Customer di cabang ini sudah match ke Machine Population.</div>`}
    </div>`;
  }
  function ctExportBranchMismatch(){
    if(typeof XLSX === "undefined"){
      alert("Library Excel belum siap dimuat (mungkin koneksi internet lambat). Silakan coba lagi beberapa saat.");
      return;
    }
    const summaryRows = [["Branch", "Customer Cocok Machine Population", "Customers NOT Matching Machine Population", "Total Customer"]];
    branchCustomerCounts.forEach(b => summaryRows.push([b.branch, b.withPop.length, b.withoutPop.length, b.total]));
    const detailRows = [["Branch", "Customers (Not Matched to Machine Population)", "Source"]];
    branchCustomerCounts.forEach(b => {
      b.withoutPop.forEach(e => {
        const src = [e.quo?"Quotation":null, e.inv?"Invoice":null].filter(Boolean).join(" + ") || "-";
        detailRows.push([b.branch, e.name, src]);
      });
    });
    const autoWidth = rows => rows[0].map((_, colIdx) => {
      let maxLen = 8;
      rows.forEach(r => { const len = String(r[colIdx]==null?"":r[colIdx]).length; if(len>maxLen) maxLen=len; });
      return { wch: Math.min(maxLen+2, 60) };
    });
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    wsSummary["!cols"] = autoWidth(summaryRows);
    const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
    wsDetail["!cols"] = autoWidth(detailRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsSummary, "Summary per Branch");
    XLSX.utils.book_append_sheet(wb, wsDetail, "Not Matched to Population");
    XLSX.writeFile(wb, `Customers_Not_Matched_Population_${currentCompany}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // ---------- Group aggregation ----------
  const groups = {};
  customerList.forEach(c => {
    const gname = c.group;
    if(!groups[gname]) groups[gname] = {
      name: gname, population: 0, invoice: emptyYearMap(), quotation: emptyYearMap(),
      invoiceYTD: emptyYearMap(), quotationYTD: emptyYearMap(),
      thisYTDInv: 0, lastYTDInv: 0, thisYTDQuo: 0, lastYTDQuo: 0, hadEarlierInv: false, members: [],
    };
    const g = groups[gname];
    g.population += c.population;
    g.members.push(c);
    YEARS.forEach(y => {
      g.invoice[y] += c.invoice[y]; g.quotation[y] += c.quotation[y];
      g.invoiceYTD[y] += c.invoiceYTD[y]; g.quotationYTD[y] += c.quotationYTD[y];
    });
    g.thisYTDInv += c.thisYTDInv; g.lastYTDInv += c.lastYTDInv;
    g.thisYTDQuo += c.thisYTDQuo; g.lastYTDQuo += c.lastYTDQuo;
    if(c.hadEarlierInv) g.hadEarlierInv = true;
  });
  const groupList = Object.values(groups)
    .filter(g => g.name !== "(No Group)") // PT tanpa Group tidak usah muncul di tabel ini — tetap ada di tabel Customer utama
    .map(g => {
      g.status = ctClassify(g.hadEarlierInv, g.thisYTDInv, g.lastYTDInv);
      g.growth = ctGrowthSince(g.invoiceYTD, YEARS);
      return g;
    })
    .sort((a,b) => b.population - a.population);

  // ---------- KPI ----------
  // Breakdown Aktivitas 3-tingkat (hasil diskusi 2026-10-01, "Opsi B"): Aktif = masih transaksi
  // tahun ini, Churned = pernah beli lalu berhenti, Prospect = punya unit tapi belum pernah beli
  // sama sekali. Ini pengganti KPI "Total Active Customers" lama yang cuma 2 kategori (gabung
  // Churned+Prospect jadi satu "Inactive") — sekarang dipisah supaya actionable: Churned
  // butuh re-activation, Prospect butuh akuisisi baru.
  const countBy = s => customerList.filter(c => c.status === s).length;
  const countByActivity = cat => customerList.filter(c => c.activityCat === cat).length;
  const activeCount = countByActivity("active");
  const churnedCount = countByActivity("churned");
  const prospectCount = countByActivity("prospect");
  const inactiveCount = countByActivity("inactive"); // Tidak Aktif — TIDAK masuk Total Customer
  const totalCustomerAll = activeCount + churnedCount + prospectCount;
  const activePct = totalCustomerAll ? Math.round((activeCount / totalCustomerAll) * 100) : 0;
  const kpiHtml = `
    <div class="kpi-row">
      ${kpiCard("Total Customer", totalCustomerAll.toLocaleString("id-ID"), "Active + Lapsed + Prospect", "neutral")}
      ${kpiCard("✅ Active (Still Transacting)", activeCount.toLocaleString("id-ID"), `${activePct}% of Total Customers`, "good")}
      ${kpiCard("🛑 Lapsed", churnedCount.toLocaleString("id-ID"), "pernah beli, sekarang berhenti, unit masih aktif — perlu re-activation", "bad")}
      ${kpiCard("🎯 Prospect", prospectCount.toLocaleString("id-ID"), "punya unit aktif, belum pernah beli — perlu akuisisi", "neutral")}
      ${kpiCard("💤 Inactive", inactiveCount.toLocaleString("id-ID"), "berhenti beli & tanpa unit aktif — tidak dihitung di Total Customer", "neutral")}
      ${kpiCard("📈 Up / 📉 Down", countBy("up").toLocaleString("id-ID") + " / " + countBy("down").toLocaleString("id-ID"), "dibanding periode sama tahun lalu (Up / Down)", "neutral")}
      ${kpiCard("🆕 New", countBy("new").toLocaleString("id-ID"), "baru mulai beli tahun ini", "good")}
    </div>`;

  const branchCustomerTableHtml = branchCustomerCounts.length
    ? `<div class="table-scroll"><table class="ast-table" id="ct-branch-table">
        <thead><tr><th>Branch</th><th style="text-align:right">✅ Active</th><th style="text-align:right">🛑 Lapsed</th><th style="text-align:right">🎯 Prospect</th><th style="text-align:right">Total Customer</th><th style="text-align:right">💤 Inactive<br><span style="font-weight:400;font-size:9.5px;">(tidak dihitung)</span></th></tr></thead>
        <tbody id="ct-branch-tbody">${branchCustomerCounts.map((b,idx) => `
          <tr class="ct-row" data-bidx="${idx}"><td><span class="caret">▶</span>${escapeHtml(b.branch)}</td><td style="text-align:right">${b.active.toLocaleString("id-ID")}</td><td style="text-align:right">${b.churned.toLocaleString("id-ID")}</td><td style="text-align:right">${b.prospect.toLocaleString("id-ID")}</td><td style="text-align:right"><strong>${b.total.toLocaleString("id-ID")}</strong></td><td style="text-align:right;color:var(--ink-soft)">${b.inactive.toLocaleString("id-ID")}</td></tr>
          <tr class="ct-detail" id="ct-branch-detail-${idx}"><td colspan="6">${ctBranchDetailHtml(b)}</td></tr>`).join("")}</tbody>
        <tfoot><tr style="border-top:2px solid var(--line);font-weight:700;"><td>Unique Total</td><td style="text-align:right">${activeCount.toLocaleString("id-ID")}</td><td style="text-align:right">${churnedCount.toLocaleString("id-ID")}</td><td style="text-align:right">${prospectCount.toLocaleString("id-ID")}</td><td style="text-align:right">${totalCustomerAll.toLocaleString("id-ID")}</td><td style="text-align:right;color:var(--ink-soft)">${inactiveCount.toLocaleString("id-ID")}</td></tr></tfoot>
      </table></div>`
    : `<div class="empty-note">Belum ada data Customer per Cabang.</div>`;

  pageBody.innerHTML = `
    ${kpiHtml}
    <div class="card-shell">
      <div class="card-title-row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="card-title">Customer Count per Branch</div>
        <button class="btn" id="ct-export-branch-mismatch" style="padding:6px 12px;font-size:12px;">⬇️ Export Excel (Not Matched to Population)</button>
      </div>
      <div class="card-subtitle">Cabang "pemilik" Customer ditentukan dari cabang yang punya Populasi (unit) DAN history Transaksi (Quotation/Invoice) sekaligus — kalau tidak ada cabang yang qualify keduanya, fallback ke cabang manapun yang ada datanya. 1 Customer bisa terhitung di lebih dari 1 Cabang kalau memang genuine ada unit + transaksi di cabang-cabang itu. ✅ Active = masih transaksi tahun ini, 🛑 Lapsed = pernah beli lalu berhenti tapi masih punya unit aktif, 🎯 Prospect = punya unit aktif tapi belum pernah beli, 💤 Inactive = berhenti beli dan tidak punya unit aktif (tidak dihitung di Total Customer). Catatan: 1 Customer yang ada di lebih dari 1 cabang dihitung di tiap cabang tsb, jadi jumlah per cabang bisa lebih besar dari <b>Unique Total</b> (baris bawah) — Unique Total inilah yang sama dengan "Total Customer" di KPI atas, Dashboard Home, dan Machine Population. Klik baris cabang untuk lihat rincian mana yang cocok/tidak cocok dengan Machine Population, atau pakai tombol Export untuk lihat semuanya sekaligus di Excel.</div>
      ${branchCustomerTableHtml}
    </div>
    <div class="card-shell">
      <div class="card-title-row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="card-title">All Customers — Annual Trend</div>
        <button class="btn" id="ct-export-main" style="padding:6px 12px;font-size:12px;">⬇️ Export Excel</button>
      </div>
      <div class="card-subtitle">Semua kolom tahun di tabel ini dihitung dengan periode yang sama, yaitu <b>January–${monthLabel}</b> tiap tahunnya (mengikuti bulan berjalan sekarang) — supaya perbandingan antar tahun apple-to-apple, bukan cuma kolom terakhir. Status/panah membandingkan Jan–${monthLabel} tahun ini vs Jan–${monthLabel} tahun lalu. Selisih dalam rentang ±8% dianggap Stabil. Kolom "Growth since ${minYear}" bandingkan tahun pertama data vs sekarang, untuk gambaran besar (Status sendiri cuma lihat 2 tahun terakhir). Kolom "Avg. Parts Purchase/Unit" = Total Invoice Divisi Parts sejak ${minYear} ÷ Jumlah Unit — makin kecil dibanding Customer sejenis lain, makin besar kemungkinan spare part unitnya "bocor" ke kompetitor. "Machine Population" hanya menghitung unit berstatus <b>Active</b> di Machine Population — unit Scrap/Unknown tidak ikut dihitung supaya rata-ratanya tidak bias; kalau Customer punya unit tidak aktif, keterangannya muncul di rincian (klik baris Customer). Total 1 tahun penuh (Jan–Des) untuk tiap tahun tetap bisa dilihat dengan klik baris Customer untuk buka rincian.</div>
      <div class="ct-filter-row">
        <div><label>Status</label>
          <select id="ct-status-filter">
            <option value="ALL">All Status</option>
            <option value="active">✅ Active (Still Transacting)</option>
            <option value="churned">🛑 Lapsed (Units Still Active)</option>
            <option value="inactive">💤 Inactive (No Active Units)</option>
            <option value="prospect">🎯 Prospect</option>
            <option value="down">📉 Down</option>
            <option value="up">📈 Up</option>
            <option value="stop">⏹️ Invoice Stopped</option>
            <option value="new">🆕 New</option>
            <option value="stable">🟨 Stable</option>
            <option value="none">⚠️ Never Purchased</option>
          </select>
        </div>
        <div><label>Urutkan</label>
          <select id="ct-sort">
            <option value="population-desc" selected>Largest Machine Population</option>
            <option value="name">Customer Name (A-Z)</option>
            <option value="growth-asc">Lowest YoY Change First</option>
            <option value="growth-desc">Highest YoY Change First</option>
            <option value="growthsince-asc">Growth since ${minYear} Terendah dulu</option>
            <option value="growthsince-desc">Growth since ${minYear} Tertinggi dulu</option>
            <option value="partsperunit-asc">Lowest Avg. Parts Purchase/Unit First</option>
            <option value="partsperunit-desc">Highest Avg. Parts Purchase/Unit First</option>
            <option value="value-desc">Largest Invoice Value</option>
          </select>
        </div>
      </div>
      <div class="ct-table-scroll-y">
        <table class="ast-table" id="ct-main-table">
          <thead><tr>
            <th>Customer</th><th style="text-align:right">Machine Population (Active)</th>
            <th style="text-align:right">Avg. Parts Purchase/Unit</th>
            ${YEARS.map(y => `<th style="text-align:right">Invoice ${y}<br><span style="font-weight:400;font-size:9.5px;">(to ${monthLabel}${y===currentYear?', YTD':''})</span></th>`).join("")}
            <th>Status</th><th style="text-align:right">Growth since ${minYear}</th><th>Auto Notes</th>
          </tr></thead>
          <tbody id="ct-main-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="card-shell">
      <div class="card-title-row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="card-title">Trend per Customer Group</div>
        <button class="btn" id="ct-export-group" style="padding:6px 12px;font-size:12px;">⬇️ Export Excel</button>
      </div>
      <div class="card-subtitle">Gabungan semua Customer di Group yang sama (kolom GROUP di sheet Machine Population). Klik nama Group untuk lihat rincian per Customer di dalamnya — berguna kalau 1 Customer turun tapi Group-nya tetap naik karena ditutupi Customer lain.</div>
      <div class="ct-table-scroll-y">
        <table class="ast-table" id="ct-group-table">
          <thead><tr>
            <th>Group</th><th style="text-align:right"># Customer</th><th style="text-align:right">Machine Population (Active)</th>
            ${YEARS.map(y => `<th style="text-align:right">Invoice ${y}<br><span style="font-weight:400;font-size:9.5px;">(to ${monthLabel}${y===currentYear?', YTD':''})</span></th>`).join("")}
            <th>Status</th><th style="text-align:right">Growth since ${minYear}</th><th>Auto Notes</th>
          </tr></thead>
          <tbody id="ct-group-tbody"></tbody>
        </table>
      </div>
    </div>
  `;

  function ctYearCell(cur, prev, isFirstYear){
    let arrow = "";
    if(!isFirstYear){
      if(cur > prev) arrow = ' <span style="color:var(--good);font-size:10px;">▲</span>';
      else if(cur < prev) arrow = ' <span style="color:var(--bad);font-size:10px;">▼</span>';
      else arrow = ' <span style="color:var(--ink-soft);font-size:10px;">▬</span>';
    }
    return `<td style="text-align:right">${fmtRpShort(cur)}${arrow}</td>`;
  }

  function ctRenderCustomerDetail(c){
    let rows = "";
    YEARS.forEach(y => {
      const wr = c.quotation[y] ? Math.round((c.invoice[y] / c.quotation[y]) * 100) : (c.invoice[y] ? 100 : 0);
      rows += `<tr><td>${y}${y===currentYear?' (current)':''}</td><td>${c.quoteCount[y]}</td>
        <td>${fmtRpShort(c.quotation[y])}</td><td>${fmtRpShort(c.invoice[y])}</td><td>${wr}%</td></tr>`;
    });
    const maxVal = Math.max(...YEARS.map(y => Math.max(c.quotation[y], c.invoice[y])), 1);
    let bars = "";
    YEARS.forEach(y => {
      const qH = Math.round((c.quotation[y] / maxVal) * 90), iH = Math.round((c.invoice[y] / maxVal) * 90);
      bars += `<div class="ct-mini-bar-group"><div class="ct-mini-bar-pair">
        <div class="ct-mini-bar quo" style="height:${qH}px" title="Quotation ${y}: ${fmtRpShort(c.quotation[y])}"></div>
        <div class="ct-mini-bar inv" style="height:${iH}px" title="Invoice ${y}: ${fmtRpShort(c.invoice[y])}"></div>
      </div><div class="ct-mini-bar-year">${y}</div></div>`;
    });
    const inactiveNote = c.populationInactive > 0
      ? `<div class="note-text flag" style="margin-bottom:10px;">⚠️ Customer ini punya <b>${c.populationInactive}</b> unit TIDAK AKTIF yang tidak ikut dihitung di Populasi Mesin/Rata-rata Beli Parts per Unit: ${c.inactiveUnits.map(u => `${u.statusCat==='scrap'?'⚫ Scrap':'🟡 Unknown'} (SN ${escapeHtml(u.snUnit)}${u.remarks?' — '+escapeHtml(u.remarks):''})`).join("; ")}</div>`
      : "";
    return `<div class="ct-detail-inner">
      <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:6px;">Rincian ini memakai <b>Full Year Total (Jan–Dec)</b> sebagai referensi historis — beda basis dari kolom ringkasan di tabel atas yang memakai Jan–${monthLabel} supaya apple-to-apple.</div>
      ${inactiveNote}
      <div class="ct-detail-grid">
      <div class="ct-detail-table-wrap"><table class="ct-detail-table">
        <thead><tr><th>Year</th><th># Quotation</th><th>Quotation Value</th><th>Invoice Value</th><th>Win Rate</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="ct-detail-chart-wrap"><div class="ct-mini-bars">${bars}</div>
        <div class="ct-mini-legend"><span><span class="ct-dot" style="background:var(--gold)"></span> Quotation</span>
        <span><span class="ct-dot" style="background:var(--teal)"></span> Invoice</span></div></div>
    </div></div>`;
  }

  function ctRenderMain(){
    const statusFilter = document.getElementById("ct-status-filter").value;
    const sortMode = document.getElementById("ct-sort").value;
    let list = customerList.filter(c => statusFilter === "ALL" || c.status === statusFilter || c.activityCat === statusFilter);
    if(sortMode === "growth-asc") list = list.slice().sort((a,b) => (a.thisYTDInv-a.lastYTDInv) - (b.thisYTDInv-b.lastYTDInv));
    else if(sortMode === "growth-desc") list = list.slice().sort((a,b) => (b.thisYTDInv-b.lastYTDInv) - (a.thisYTDInv-a.lastYTDInv));
    else if(sortMode === "growthsince-asc") list = list.slice().sort((a,b) => ctGrowthPctForSort(a.growth) - ctGrowthPctForSort(b.growth));
    else if(sortMode === "growthsince-desc") list = list.slice().sort((a,b) => ctGrowthPctForSort(b.growth) - ctGrowthPctForSort(a.growth));
    else if(sortMode === "value-desc") list = list.slice().sort((a,b) => b.invoiceYTD[currentYear] - a.invoiceYTD[currentYear]);
    else if(sortMode === "population-desc") list = list.slice().sort((a,b) => b.population - a.population);
    else if(sortMode === "partsperunit-asc") list = list.slice().sort((a,b) => (a.avgPartsPerUnit ?? -Infinity) - (b.avgPartsPerUnit ?? -Infinity));
    else if(sortMode === "partsperunit-desc") list = list.slice().sort((a,b) => (b.avgPartsPerUnit ?? -Infinity) - (a.avgPartsPerUnit ?? -Infinity));
    else list = list.slice().sort((a,b) => a.name.localeCompare(b.name));

    let html = "";
    list.forEach((c, idx) => {
      html += `<tr class="ct-row" data-idx="${idx}"><td><span class="caret">▶</span>${escapeHtml(c.name)}</td>`;
      html += `<td style="text-align:right">${c.population ? c.population.toLocaleString("id-ID")+" unit" : '<span style="color:var(--ink-soft)">-</span>'}</td>`;
      html += `<td style="text-align:right">${c.avgPartsPerUnit!=null ? fmtRpShort(c.avgPartsPerUnit) : '<span style="color:var(--ink-soft)">-</span>'}</td>`;
      YEARS.forEach((y,i) => {
        html += ctYearCell(c.invoiceYTD[y], i===0 ? 0 : c.invoiceYTD[YEARS[i-1]], i===0);
      });
      html += `<td>${CT_ACTIVITY_BADGE[c.activityCat]}<br>${CT_STATUS_BADGE[c.status]}<br>${CT_QUO_BADGE_SM[c.quoStatus]}</td>`;
      html += ctGrowthCell(c.growth);
      html += `<td class="note-text${c.note.flag?' flag':''}">${escapeHtml(c.note.text)}</td></tr>`;
      html += `<tr class="ct-detail" id="ct-detail-${idx}"><td colspan="${YEARS.length+6}">${ctRenderCustomerDetail(c)}</td></tr>`;
    });
    document.getElementById("ct-main-tbody").innerHTML = html || `<tr><td colspan="${YEARS.length+6}" class="empty-note">Tidak ada Customer untuk filter ini.</td></tr>`;
    document.querySelectorAll("#ct-main-table .ct-row").forEach(row => {
      row.addEventListener("click", () => {
        row.classList.toggle("open");
        document.getElementById("ct-detail-" + row.dataset.idx).classList.toggle("open");
      });
    });
    ctMainListCache = list;
  }

  function ctExportMain(){
    const headers = ["Customer", "Activity Category", "Machine Population (Active)", `Avg. Parts Purchase/Unit (since ${minYear})`,
      ...YEARS.map(y => `Invoice ${y} (to ${monthLabel})`),
      "Invoice Status", "Status Quotation", `Growth since ${minYear} (%)`, "Auto Notes"];
    const rows = [headers];
    ctMainListCache.forEach(c => {
      rows.push([
        c.name, CT_ACTIVITY_LABEL[c.activityCat], c.population, c.avgPartsPerUnit!=null ? Math.round(c.avgPartsPerUnit) : "",
        ...YEARS.map(y => Math.round(c.invoiceYTD[y])),
        CT_STATUS_TEXT[c.status], CT_STATUS_TEXT[c.quoStatus],
        c.growth && c.growth.pct !== null ? Math.round(c.growth.pct) : "",
        c.note.text,
      ]);
    });
    ctDownloadExcel(`Customer_Trend_${currentCompany}_${new Date().toISOString().slice(0,10)}.xlsx`, "Customer Trend", rows);
  }

  function ctRenderGroupDetail(g){
    let rows = "";
    g.members.slice().sort((a,b) => b.invoiceYTD[currentYear] - a.invoiceYTD[currentYear]).forEach(m => {
      rows += `<tr><td>${escapeHtml(m.name)}</td><td>${m.population.toLocaleString("id-ID")} unit</td>
        <td>${fmtRpShort(m.invoiceYTD[currentYear-1]||0)}</td><td>${fmtRpShort(m.invoiceYTD[currentYear]||0)}</td>
        <td>${CT_STATUS_BADGE[m.status]}</td></tr>`;
    });
    return `<div class="ct-detail-inner"><div class="ct-detail-table-wrap" style="max-width:680px;">
      <table class="ct-detail-table">
        <thead><tr><th>Customers in This Group</th><th>Population</th><th>Invoice ${currentYear-1} (to ${monthLabel})</th><th>Invoice ${currentYear} (to ${monthLabel})</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  }

  function ctRenderGroups(){
    let html = "";
    groupList.forEach((g, idx) => {
      const downCount = g.members.filter(m => m.status === "down" || m.status === "stop").length;
      let note = { text: `Group berisi ${g.members.length} Customer.`, flag: false };
      if(g.status === "up" && downCount > 0) note = { text: `Group naik meskipun ${downCount} dari ${g.members.length} Customer di dalamnya turun/berhenti — ditutupi oleh Customer lain yang naik di Group yang sama.`, flag: true };
      else if((g.status === "down" || g.status === "stop") && g.members.length > 1) note = { text: `Group ini kompak menurun (${g.members.length} Customer).`, flag: true };
      note = ctAppendLongTermTrend(note, g.invoiceYTD, g.quotationYTD, YEARS);
      g._note = note; // dipakai lagi oleh ctExportGroups supaya Catatan-nya sama persis dgn yang tampil
      html += `<tr class="ct-row" data-gidx="${idx}"><td><span class="caret">▶</span>${escapeHtml(g.name)}</td>`;
      html += `<td style="text-align:right">${g.members.length}</td>`;
      html += `<td style="text-align:right">${g.population.toLocaleString("id-ID")} unit</td>`;
      YEARS.forEach((y,i) => {
        html += ctYearCell(g.invoiceYTD[y], i===0 ? 0 : g.invoiceYTD[YEARS[i-1]], i===0);
      });
      html += `<td>${CT_STATUS_BADGE[g.status]}</td>`;
      html += ctGrowthCell(g.growth);
      html += `<td class="note-text${note.flag ? ' flag':''}">${escapeHtml(note.text)}</td></tr>`;
      html += `<tr class="ct-detail" id="ct-group-detail-${idx}"><td colspan="${YEARS.length+6}">${ctRenderGroupDetail(g)}</td></tr>`;
    });
    document.getElementById("ct-group-tbody").innerHTML = html || `<tr><td colspan="${YEARS.length+6}" class="empty-note">Belum ada data Group.</td></tr>`;
    document.querySelectorAll("#ct-group-table .ct-row").forEach(row => {
      row.addEventListener("click", () => {
        row.classList.toggle("open");
        document.getElementById("ct-group-detail-" + row.dataset.gidx).classList.toggle("open");
      });
    });
  }

  function ctExportGroups(){
    const headers = ["Group", "# Customer", "Machine Population (Active)",
      ...YEARS.map(y => `Invoice ${y} (to ${monthLabel})`),
      "Status", `Growth since ${minYear} (%)`, "Auto Notes"];
    const rows = [headers];
    groupList.forEach(g => {
      rows.push([
        g.name, g.members.length, g.population,
        ...YEARS.map(y => Math.round(g.invoiceYTD[y])),
        CT_STATUS_TEXT[g.status],
        g.growth && g.growth.pct !== null ? Math.round(g.growth.pct) : "",
        g._note ? g._note.text : "",
      ]);
    });
    ctDownloadExcel(`Customer_Trend_Group_${currentCompany}_${new Date().toISOString().slice(0,10)}.xlsx`, "Trend per Group", rows);
  }

  document.getElementById("ct-status-filter").addEventListener("change", ctRenderMain);
  document.getElementById("ct-sort").addEventListener("change", ctRenderMain);
  document.getElementById("ct-export-main").addEventListener("click", ctExportMain);
  document.getElementById("ct-export-group").addEventListener("click", ctExportGroups);
  document.getElementById("ct-export-branch-mismatch").addEventListener("click", ctExportBranchMismatch);
  document.querySelectorAll("#ct-branch-table .ct-row").forEach(row => {
    row.addEventListener("click", () => {
      row.classList.toggle("open");

/* ============================================================== *
 *  CUSTOMER COVERAGE — per Cabang, per Bulan                       *
 *  "Tercover" = Customer yang punya minimal 1 transaksi (Quotation *
 *  / Invoice / Parts Delivery) di cabang & bulan tsb. Basis Total   *
 *  Customer per cabang = union Quotation+Invoice+Machine Population*
 *  sepanjang data (definisi sama dengan "Jumlah Customer per        *
 *  Cabang" di halaman Customer Trend), supaya coverage % konsisten *
 *  dengan angka yang sudah ada. Ini BUKAN kunjungan PSSR — sheet    *
 *  Machine Population cuma simpan snapshot kunjungan terakhir       *
 *  (bukan log historis per bulan), jadi belum bisa dipakai untuk    *
 *  tren coverage per PSSR ke belakang.                              *
 * ============================================================== */
function last12Periods(){
  const now = new Date();
  const periods = [];
  for(let i = 11; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    periods.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return periods;
}
/* Warna heatmap: merah (rendah) -> kuning (sedang) -> hijau (tinggi), interpolasi halus. */
function heatColor(pct){
  if(pct == null || isNaN(pct)) return "transparent";
  const stops = [ {p:0, c:[201,86,60]}, {p:50, c:[230,179,87]}, {p:100, c:[107,143,78]} ];
  let lo = stops[0], hi = stops[stops.length-1];
  for(let i = 0; i < stops.length-1; i++){
    if(pct >= stops[i].p && pct <= stops[i+1].p){ lo = stops[i]; hi = stops[i+1]; break; }
  }
  const span = (hi.p - lo.p) || 1;
  const t = Math.max(0, Math.min(1, (pct - lo.p) / span));
  const mix = lo.c.map((v,i) => Math.round(v + (hi.c[i]-v) * t));
  return `rgba(${mix[0]},${mix[1]},${mix[2]},0.32)`;
}

async function renderCustomerCoverage(){
  const [quoS, invS, pdS, popS, aliasMap] = await Promise.all([
    fetchSheet("quotations"), fetchSheet("invoices"), fetchSheet("partsDelivery"), fetchSheet("population"), getCustomerAliasMap(),
  ]);

  let quoRows = rowsToObjects(quoS, { no:0, date:1, customer:2, branch:7 });
  quoRows = quoRows.filter(r => r.no || r.date instanceof Date);
  let invRows = rowsToObjects(invS, { branch:0, invoice:1, date:2, customer:3, type:4, value:7 });
  invRows = invRows.filter(r => r.invoice || r.date instanceof Date);
  let pdRows = rowsToObjects(pdS, { customer:1, date:2, deliveryNo:3, branch:8 });
  pdRows = pdRows.filter(r => r.deliveryNo || r.date instanceof Date);

  if(currentCompany === "IKE" && quoRows.length===0 && invRows.length===0 && pdRows.length===0){
    pageBody.innerHTML = noIkeDataBanner("Coverage Customer"); return;
  }

  // Samakan nama Customer yang pernah rename/merger (tab "Customer Alias") SEBELUM apapun
  // dikelompokkan — konsisten dengan Customer Trend.
  applyCustomerAlias(quoRows, aliasMap);
  applyCustomerAlias(invRows, aliasMap);
  applyCustomerAlias(pdRows, aliasMap);
  // Opsi A (2026-10-06): data TIDAK difilter cabang di sini — kepemilikan cabang & kategori
  // Customer dihitung dari SEMUA cabang; filter cabang baru diterapkan ke daftar cabang di bawah.
  let popRows = rowsToObjects(popS, { customer:7, branch:6, snUnit:3, status:15 });
  popRows = popRows.filter(r => r.snUnit);
  applyCustomerAlias(popRows, aliasMap);
  popRows.forEach(r => { r.statusCat = unitStatusCategory(r.status); });
  // Sinyal "pop" (Machine Population) untuk penentuan cabang HANYA dari unit AKTIF — unit yang
  // sudah Scrap/Unknown di suatu cabang tidak boleh ikut membuat Customer "kebaca" masih punya
  // unit di cabang itu (hasil diskusi 2026-10-02: unit pindah/sudah tidak aktif di cabang lama,
  // tapi masih kebaca Prospect di cabang lama tsb).
  const popActiveRows = popRows.filter(r => r.statusCat === "active");

  // Cabang "pemilik" Customer — logika SAMA dengan "Customer Count per Branch" di Customer
  // Trend (hasil diskusi 2026-10-01 & 2026-10-02): AND diutamakan (Populasi AKTIF & Transaksi di
  // cabang yang sama); kalau tidak ada AND tapi Customer punya unit AKTIF di cabang tertentu,
  // pakai cabang unit aktifnya itu saja (transaksi "numpang" di cabang lain tidak ikut
  // menghitung dia di cabang itu); fallback ke OR (cabang manapun ada sinyal) HANYA kalau
  // Customer sama sekali tidak punya unit aktif di manapun.
  const baseByBranch = {}; // Total Customer per Cabang (semua kategori, termasuk Prospect)
  const ownershipAll = ctBuildOwnership(quoRows, invRows, popActiveRows);
  Object.entries(ownershipAll.ownedByBranch).forEach(([b, set]) => {
    if(ctBranchSelected(b)) baseByBranch[b] = set; // hanya cabang yang dipilih di filter
  });

  // Klasifikasi Aktif/Churned/Prospect per Customer — definisi SAMA dengan ctActivityCategory
  // di Customer Trend (Opsi B, hasil diskusi 2026-10-01), dari SEMUA Quotation+Invoice (bukan
  // Parts Delivery — konsisten dengan Customer Trend yang juga tidak pakai Parts Delivery untuk
  // status ini). Prospect DIKELUARKAN dari pembagi Coverage % di bawah, supaya % tidak bias
  // turun oleh Customer yang memang belum pernah ditawari/closing sama sekali.
  const now = new Date();
  const currentYear = now.getFullYear(), todayMonth = now.getMonth(), todayDay = now.getDate();
  const txActivity = {}; // key -> { everTx, ytdTx }
  function markTx(customer, date){
    const key = normalizeCustomerKey(customer);
    if(!key) return;
    if(!txActivity[key]) txActivity[key] = { everTx:false, ytdTx:false };
    txActivity[key].everTx = true;
    if(date instanceof Date && !isNaN(date) && date.getFullYear() === currentYear){
      const m = date.getMonth(), d = date.getDate();
      if(m < todayMonth || (m === todayMonth && d <= todayDay)) txActivity[key].ytdTx = true;
    }
  }
  invRows.forEach(r => markTx(r.customer, r.date));
  quoRows.forEach(r => markTx(r.customer, r.date));
  const activePopKeys = new Set(popActiveRows.map(r => normalizeCustomerKey(r.customer)).filter(Boolean));
  function classifyActivity(key){
    const a = txActivity[key];
    if(!a || !a.everTx) return "prospect";
    if(a.ytdTx) return "active";
    return activePopKeys.has(key) ? "churned" : "inactive"; // inactive = berhenti & tanpa unit aktif
  }
  const eligibleByBranch = {}; // baseByBranch dikurangi Prospect — dipakai sbg pembagi Coverage %
  const activityBreakdown = [];
  Object.keys(baseByBranch).forEach(b => {
    let active = 0, churned = 0, prospect = 0, inactive = 0;
    const eligible = new Set();
    baseByBranch[b].forEach(key => {
      const cat = classifyActivity(key);
      if(cat === "active"){ active++; eligible.add(key); }
      else if(cat === "churned"){ churned++; eligible.add(key); }
      else if(cat === "inactive") inactive++; // tidak masuk Total Customer maupun pembagi
      else prospect++;
    });
    eligibleByBranch[b] = eligible;
    activityBreakdown.push({ branch:b, active, churned, prospect, inactive, total: active + churned + prospect });
  });
  activityBreakdown.sort((a,b) => b.total - a.total);
  // Total UNIK lintas cabang (1 Customer yang ada di >1 cabang cuma dihitung sekali) — angka ini
  // sama dengan "Total Customer" di Customer Trend/Dashboard Home/Machine Population.
  const uniqueByCat = { active:new Set(), churned:new Set(), prospect:new Set(), inactive:new Set() };
  Object.values(baseByBranch).forEach(set => set.forEach(key => uniqueByCat[classifyActivity(key)].add(key)));
  const uniqueTotalCustomer = uniqueByCat.active.size + uniqueByCat.churned.size + uniqueByCat.prospect.size;

  // Coverage per Cabang per Bulan (12 bulan terakhir) — Customer unik yang punya
  // transaksi (Quotation/Invoice/Parts Delivery) di cabang & bulan tsb.
  const periods = last12Periods();
  const periodSet = new Set(periods);
  const coveredByBranchPeriod = {}; // branch -> period -> Set(customerKey)
  function addCovered(branch, customer, date){
    const b = String(branch||"").trim();
    const key = normalizeCustomerKey(customer);
    const pk = periodKey(date);
    if(!b || !key || !pk || !periodSet.has(pk)) return;
    if(!coveredByBranchPeriod[b]) coveredByBranchPeriod[b] = {};
    if(!coveredByBranchPeriod[b][pk]) coveredByBranchPeriod[b][pk] = new Set();
    coveredByBranchPeriod[b][pk].add(key);
  }
  invRows.forEach(r => addCovered(r.branch, r.customer, r.date));
  quoRows.forEach(r => addCovered(r.branch, r.customer, r.date));
  pdRows.forEach(r => addCovered(r.branch, r.customer, r.date));

  const branches = Object.keys(baseByBranch).sort((a,b) => baseByBranch[b].size - baseByBranch[a].size);
  const periodLabels = periods.map(periodLabel);
  const curPeriod = periods[periods.length-1];

  // Pembagi Coverage % = eligibleByBranch (Aktif+Churned, Prospect DIKELUARKAN) — bukan
  // baseByBranch (semua kategori). "Total Customer" (baseByBranch) tetap ditampilkan terpisah
  // di tabel breakdown Aktivitas di bawah, untuk referensi berapa Prospect yang belum digarap.
  const totalEligibleAll = new Set();
  Object.values(eligibleByBranch).forEach(set => set.forEach(k=>totalEligibleAll.add(k)));
  const totalPctData = periods.map(pk => {
    const coveredSet = new Set();
    branches.forEach(b => { const s = coveredByBranchPeriod[b]?.[pk]; if(s) s.forEach(k=>{ if(eligibleByBranch[b].has(k)) coveredSet.add(k); }); });
    return totalEligibleAll.size ? Math.round(coveredSet.size/totalEligibleAll.size*100) : 0;
  });
  const totalCoveredCurCount = (() => {
    const s = new Set();
    branches.forEach(b => { const set = coveredByBranchPeriod[b]?.[curPeriod]; if(set) set.forEach(k=>{ if(eligibleByBranch[b].has(k)) s.add(k); }); });
    return s.size;
  })();
  const coveragePctAll = totalEligibleAll.size ? Math.round(totalCoveredCurCount/totalEligibleAll.size*100) : 0;

  const branchPcts = branches.map(b => {
    const base = eligibleByBranch[b].size;
    const covered = [...(coveredByBranchPeriod[b]?.[curPeriod] || [])].filter(k => eligibleByBranch[b].has(k)).length;
    return { branch:b, base, covered, pct: base ? Math.round(covered/base*100) : 0 };
  });
  const bestBranch = branchPcts.length ? branchPcts.reduce((a,c)=>c.pct>a.pct?c:a) : null;
  const worstBranch = branchPcts.length ? branchPcts.reduce((a,c)=>c.pct<a.pct?c:a) : null;

  // ---- Chart tren 12 bulan (1 garis per cabang + 1 garis Total, % coverage) ----
  const lineDatasets = [
    { label:"All Branches", color:"#3a3226", data: totalPctData },
    ...branches.map((b,i) => ({
      label: b, color: PIE_PALETTE[i % PIE_PALETTE.length],
      data: periods.map(pk => {
        const base = eligibleByBranch[b].size;
        const covered = [...(coveredByBranchPeriod[b]?.[pk] || [])].filter(k => eligibleByBranch[b].has(k)).length;
        return base ? Math.round(covered/base*100) : 0;
      })
    }))
  ];

  // ---- Tabel heatmap Bulan x Cabang ----
  const heatHead = `<th>Branch</th>${periodLabels.map(l=>`<th style="text-align:center">${escapeHtml(l)}</th>`).join("")}<th style="text-align:center">Measured Customers (Active+Lapsed)</th>`;
  const heatRow = (label, base, coveredFn, bold) => {
    const cells = periods.map(pk => {
      const covered = coveredFn(pk);
      const pct = base ? Math.round(covered/base*100) : 0;
      return `<td style="text-align:center;background:${heatColor(pct)}">
        <div style="font-weight:700">${pct}%</div>
        <div style="font-size:10.5px;color:var(--ink-soft)">${covered}/${base}</div>
      </td>`;
    }).join("");
    return `<tr${bold?' style="border-top:2px solid var(--gridline)"':''}><td>${bold?'<strong>':''}${escapeHtml(label)}${bold?'</strong>':''}</td>${cells}<td style="text-align:center">${bold?'<strong>':''}${base.toLocaleString("id-ID")}${bold?'</strong>':''}</td></tr>`;
  };
  const heatBody = branches.map(b => heatRow(b, eligibleByBranch[b].size, pk => [...(coveredByBranchPeriod[b]?.[pk] || [])].filter(k => eligibleByBranch[b].has(k)).length, false)).join("")
    + heatRow("All Branches", totalEligibleAll.size, pk => {
        const s = new Set();
        branches.forEach(b => { const set = coveredByBranchPeriod[b]?.[pk]; if(set) set.forEach(k=>{ if(eligibleByBranch[b].has(k)) s.add(k); }); });
        return s.size;
      }, true);
  // ---- Rincian customer tercover per SUMBER transaksi (per bulan, semua cabang terpilih) ----
  // Tiap customer tercover dimasukkan ke SATU kelompok (prioritas): Invoice Type kategori >
  // Invoice Type lain saja > Quotation without Invoice > Parts Delivery saja — jadi jumlahnya
  // pas = total tercover bulan itu. Acuan Invoice = kolom TYPE (bukan Division turunan).
  // Aturan "tercover" sama persis dengan heatmap di atas (transaksi di cabang tsb DAN customer
  // termasuk Measured Customers cabang itu).
  const catTypeSet = new Set(invoiceCategoryTypes().map(t => t.trim().toLowerCase()));
  const srcFlags = {}; // periodKey -> key -> { invCat, invOther, quo, pd }
  function markSrc(branch, customer, date, flag){
    const b = String(branch||"").trim();
    const key = normalizeCustomerKey(customer);
    const pk = periodKey(date);
    if(!b || !key || !pk || !periodSet.has(pk) || !eligibleByBranch[b] || !eligibleByBranch[b].has(key)) return;
    if(!srcFlags[pk]) srcFlags[pk] = {};
    if(!srcFlags[pk][key]) srcFlags[pk][key] = { invCat:false, invOther:false, quo:false, pd:false };
    srcFlags[pk][key][flag] = true;
  }
  invRows.forEach(r => markSrc(r.branch, r.customer, r.date, catTypeSet.has(String(r.type||"").trim().toLowerCase()) ? "invCat" : "invOther"));
  quoRows.forEach(r => markSrc(r.branch, r.customer, r.date, "quo"));
  pdRows.forEach(r => markSrc(r.branch, r.customer, r.date, "pd"));
  const sourceRows = periods.map((pk, i) => {
    let invCat = 0, invOther = 0, quoOnly = 0, pdOnly = 0;
    Object.values(srcFlags[pk] || {}).forEach(f => {
      if(f.invCat) invCat++;
      else if(f.invOther) invOther++;
      else if(f.quo) quoOnly++;
      else pdOnly++;
    });
    return { label: periodLabels[i], invCat, invOther, quoOnly, pdOnly, total: invCat + invOther + quoOnly + pdOnly };
  });
  const nf = n => n.toLocaleString("id-ID");

  // ---- Dilayani tapi dimiliki cabang lain (informasi — TIDAK ikut Coverage %) ----
  // Customer yang punya transaksi (Quotation/Invoice/Parts Delivery) di cabang b pada bulan tsb,
  // tapi bukan Measured Customers cabang b karena pemiliknya cabang lain.
  const crossServed = {}; // b -> pk -> Map(key -> { name, owners, invCat })

    const b = String(branch||"").trim();
    const key = normalizeCustomerKey(customer);
    const pk = periodKey(date);
    if(!b || !key || !pk || !periodSet.has(pk) || !baseByBranch[b]) return;
    if(baseByBranch[b].has(key)) return; // dimiliki cabang ini sendiri
    const owners = Object.entries(ownershipAll.ownedByBranch).filter(([bb, set]) => bb !== b && set.has(key)).map(([bb]) => bb);
    if(!owners.length) return;
    if(!crossServed[b]) crossServed[b] = {};
    if(!crossServed[b][pk]) crossServed[b][pk] = new Map();
    const m = crossServed[b][pk];
    if(!m.has(key)) m.set(key, { name:String(customer).trim(), owners, invCat:false });
    if(isInvCat) m.get(key).invCat = true;
  }
  invRows.forEach(r => markCross(r.branch, r.customer, r.date, catTypeSet.has(String(r.type||"").trim().toLowerCase())));
  quoRows.forEach(r => markCross(r.branch, r.customer, r.date, false));
  pdRows.forEach(r => markCross(r.branch, r.customer, r.date, false));
  const crossBranches = branches.filter(b => periods.some(pk => crossServed[b]?.[pk]?.size));
  const crossTableHtml = crossBranches.length ? `<div class="card-shell">
      <div class="card-title">Served, Owned by Another Branch — Last 12 Months</div>
      <div class="card-subtitle">Customer yang bertransaksi (Quotation/Invoice/Parts Delivery) di cabang ini, tetapi unit aktifnya tercatat di cabang lain. <b>Excluded</b> Coverage % (supaya pembagi dan pembilang sebanding) — ditampilkan sebagai informasi. Ini penyebab selisih dengan "Transacting Customers" di Top Customer. Arahkan kursor ke angka untuk melihat nama customer dan cabang pemiliknya (★ = punya Invoice Type kategori).</div>
      <div class="table-scroll"><table class="ast-table">
        <thead><tr><th>Branch</th>${periodLabels.map(l => `<th style="text-align:right">${escapeHtml(l)}</th>`).join("")}</tr></thead>
        <tbody>${crossBranches.map(b => `<tr><td>${escapeHtml(b)}</td>${periods.map(pk => {
          const m = crossServed[b]?.[pk];
          if(!m || !m.size) return `<td style="text-align:right;color:var(--ink-soft)">–</td>`;
          const tip = [...m.values()].sort((x, y) => x.name.localeCompare(y.name)).map(v => (v.invCat ? "★ " : "") + v.name + " (milik " + v.owners.join(", ") + ")").join("\n");
          return `<td style="text-align:right" title="${escapeHtml(tip)}"><strong>${m.size}</strong></td>`;
        }).join("")}</tr>`).join("")}</tbody>
      </table></div></div>` : "";

  const sourceTableHtml = branches.length ? `<div class="card-shell">
      <div class="card-title">Covered Customers by Transaction Source — Last 12 Months</div>
      <div class="card-subtitle">Menjawab "kenapa Coverage lebih banyak dari Customer yang punya Invoice": customer dihitung tercover walau baru sampai Quotation atau Parts Delivery. Tiap customer tercover dimasukkan ke satu kelompok saja (urutan prioritas dari kiri ke kanan). Customer yang hanya punya Invoice dengan Type di luar kategori tidak ditampilkan di kolom rincian, jadi jumlah ketiga kolom bisa lebih kecil dari Total Tercover. <b>Invoice (Type category)</b> memakai kolom <b>Type</b> di Sales Invoice (${escapeHtml(invoiceCategoryTypes().join(", "))}) — acuannya sama dengan menu Top Customer; kolom Division turunan tidak dipakai. Mengikuti filter Cabang yang dipilih.</div>
      <div class="table-scroll"><table class="ast-table">
        <thead><tr><th>Month</th><th style="text-align:right">Total Covered</th><th style="text-align:right">Invoice (Type category)</th><th style="text-align:right">Quotation without Invoice</th><th style="text-align:right">Parts Delivery Only</th></tr></thead>
        <tbody>${sourceRows.map(r => `<tr><td>${escapeHtml(r.label)}</td><td style="text-align:right"><strong>${nf(r.total)}</strong></td><td style="text-align:right">${nf(r.invCat)}</td><td style="text-align:right">${nf(r.quoOnly)}</td><td style="text-align:right">${nf(r.pdOnly)}</td></tr>`).join("")}</tbody>
      </table></div></div>` : "";

  const heatmapHtml = branches.length
    ? `<div class="card-shell"><div class="card-title">Customer Coverage per Branch — Last 12 Months</div>
        <div class="card-subtitle">% dari Measured Customers (Aktif + Lapsed) cabang (Prospect dan Tidak Aktif TIDAK ikut jadi pembagi) yang punya minimal 1 transaksi (Quotation/Invoice/Parts Delivery) pada bulan tsb. Merah = coverage rendah, Kuning = sedang, Hijau = tinggi.</div>
        <div class="table-scroll"><table class="ast-table"><thead><tr>${heatHead}</tr></thead><tbody>${heatBody}</tbody></table></div></div>`
    : `<div class="card-shell"><div class="card-title">Customer Coverage per Branch — Last 12 Months</div><div class="empty-note">Belum ada data.</div></div>`;

  // ---- Tabel breakdown Aktivitas per Cabang (Aktif/Churned/Prospect) ----
  const activityTableHtml = activityBreakdown.length
    ? `<div class="card-shell"><div class="card-title">Customer Activity Breakdown per Branch</div>
        <div class="card-subtitle">✅ Active = masih transaksi tahun ini, 🛑 Lapsed = pernah beli lalu berhenti tapi unit masih aktif, 🎯 Prospect = punya unit aktif tapi belum pernah beli, 💤 Inactive = berhenti beli dan tanpa unit aktif (tidak dihitung di Total Customer). Cabang "pemilik" Customer memakai definisi yang sama dengan "Customer Count per Branch" di Customer Trend (Populasi+Transaksi di cabang yang sama).</div>
        <div class="table-scroll"><table class="ast-table">
          <thead><tr><th>Branch</th><th style="text-align:right">✅ Active</th><th style="text-align:right">🛑 Lapsed</th><th style="text-align:right">🎯 Prospect</th><th style="text-align:right">Total Customer</th><th style="text-align:right">💤 Inactive (not counted)</th></tr></thead>
          <tbody>${activityBreakdown.map(b => `<tr><td>${escapeHtml(b.branch)}</td><td style="text-align:right">${b.active.toLocaleString("id-ID")}</td><td style="text-align:right">${b.churned.toLocaleString("id-ID")}</td><td style="text-align:right">${b.prospect.toLocaleString("id-ID")}</td><td style="text-align:right"><strong>${b.total.toLocaleString("id-ID")}</strong></td><td style="text-align:right;color:var(--ink-soft)">${b.inactive.toLocaleString("id-ID")}</td></tr>`).join("")}</tbody>
          <tfoot><tr style="border-top:2px solid var(--line);font-weight:700;"><td>Unique Total</td><td style="text-align:right">${uniqueByCat.active.size.toLocaleString("id-ID")}</td><td style="text-align:right">${uniqueByCat.churned.size.toLocaleString("id-ID")}</td><td style="text-align:right">${uniqueByCat.prospect.size.toLocaleString("id-ID")}</td><td style="text-align:right">${uniqueTotalCustomer.toLocaleString("id-ID")}</td><td style="text-align:right;color:var(--ink-soft)">${uniqueByCat.inactive.size.toLocaleString("id-ID")}</td></tr></tfoot>

  pageBody.innerHTML = `

/* ============================================================== *
 *  TOP CUSTOMER — 20 Customer dengan nilai Invoice terbesar pada   *
 *  periode filter tanggal (ikut filter Cabang), dipecah per        *
 *  kategori Type. Baris invoice dengan Type di luar kategori yang  *
 *  ditampilkan DIABAIKAN. Nama Customer sudah disatukan lewat tab  *
 *  "Customer Alias". (diskusi 2026-10-07)                          *
 * ============================================================== */
async function renderTopCustomer(){
  const [s, aliasMap] = await Promise.all([fetchSheet("invoices"), getCustomerAliasMap()]);
  let rowsRaw = rowsToObjects(s, { branch:0, invoice:1, date:2, customer:3, type:4, value:7 });
  rowsRaw = rowsRaw.filter(r => r.invoice || r.date instanceof Date);
  if(currentCompany === "IKE" && rowsRaw.length === 0){ pageBody.innerHTML = noIkeDataBanner("Top Customer"); return; }
  applyCustomerAlias(rowsRaw, aliasMap);
  const rows = applyFilters(rowsRaw, "date", "branch");

  // IKE baru punya 3 kategori; IPE 5 kategori (Track Link belum ditampilkan).
  const TYPES = invoiceCategoryTypes();
  const normType = t => String(t||"").trim().toLowerCase();
  const typeIdx = {}; TYPES.forEach((t, i) => { typeIdx[normType(t)] = i; });

  const byCust = {};
  rows.forEach(r => {
    const ti = typeIdx[normType(r.type)];
    if(ti === undefined) return; // Type di luar kategori yang ditampilkan — diabaikan
    const name = String(r.customer||"").trim();
    const key = normalizeCustomerKey(name);
    if(!key) return;
    if(!byCust[key]) byCust[key] = { name, vals: TYPES.map(() => 0), total: 0 };
    const v = toNum(r.value);
    byCust[key].vals[ti] += v;
    byCust[key].total += v;
  });
  const all = Object.values(byCust);
  const grandTotal = all.reduce((a, c) => a + c.total, 0);
  const top = all.filter(c => c.total > 0).sort((a, b) => b.total - a.total).slice(0, 20);
  const topTotal = top.reduce((a, c) => a + c.total, 0);
  const share = grandTotal ? Math.round(topTotal / grandTotal * 100) : 0;
  const periodTxt = (globalFilters.dateFrom || globalFilters.dateTo)
    ? `${globalFilters.dateFrom ? fmtDate(globalFilters.dateFrom) : "start"} to ${globalFilters.dateTo ? fmtDate(globalFilters.dateTo) : "now"}`
    : "All periods";

  const head = ["#", "Customer", ...TYPES, "Total"];
  const bodyHtml = top.map((c, i) => `<tr>
      <td style="text-align:right;color:var(--ink-soft)">${i+1}</td>
      <td>${escapeHtml(c.name)}</td>
      ${c.vals.map(v => `<td style="text-align:right">${v ? fmtRpShort(v) : '<span style="color:var(--ink-soft)">-</span>'}</td>`).join("")}
      <td style="text-align:right"><strong>${fmtRpShort(c.total)}</strong></td></tr>`).join("");
  const footHtml = top.length ? `<tr style="border-top:2px solid var(--line);font-weight:700;">
      <td></td><td>Total Top ${top.length}</td>
      ${TYPES.map((_, ti) => `<td style="text-align:right">${fmtRpShort(top.reduce((a, c) => a + c.vals[ti], 0))}</td>`).join("")}
      <td style="text-align:right">${fmtRpShort(topTotal)}</td></tr>` : "";

  pageBody.innerHTML = `
    <div class="kpi-row">
      ${kpiCard("Top Total Spend " + top.length, fmtRpShort(topTotal), periodTxt, "good")}
      ${kpiCard("Share of Total Invoice", share + "%", "dari " + fmtRpShort(grandTotal) + " (kategori yang ditampilkan)", "neutral")}
      ${kpiCard("Transacting Customers", all.length.toLocaleString("id-ID"), "pada periode & cabang terpilih", "neutral")}
    </div>
    <div class="card-shell">
      <div class="card-title-row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="card-title">Top 20 Customers — Invoice Value per Category</div>
        <button class="btn" id="tc-export" style="padding:6px 12px;font-size:12px;">⬇️ Export Excel</button>
      </div>
      <div class="card-subtitle">Period: <b>${escapeHtml(periodTxt)}</b> (mengikuti filter tanggal & cabang di atas). Diurutkan dari total nilai Invoice terbesar. Hanya kategori ${TYPES.join(", ")} yang dihitung — Invoice dengan Type lain diabaikan. Nama Customer yang pernah rename/merger sudah disatukan lewat tab Customer Alias.</div>
      ${top.length
        ? `<div class="table-scroll"><table class="ast-table"><thead><tr>${head.map((h, i) => `<th${i >= 2 ? ' style="text-align:right"' : ''}>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${bodyHtml}${footHtml}</tbody></table></div>`
        : `<div class="empty-note">Belum ada data Invoice pada periode ini.</div>`}
    </div>`;
  const btn = document.getElementById("tc-export");
  if(btn) btn.addEventListener("click", () => {
    const out = [["#", "Customer", ...TYPES, "Total"]];
    top.forEach((c, i) => out.push([i + 1, c.name, ...c.vals.map(v => Math.round(v)), Math.round(c.total)]));
    out.push(["", "Top Total " + top.length, ...TYPES.map((_, ti) => Math.round(top.reduce((a, c) => a + c.vals[ti], 0))), Math.round(topTotal)]);
    ctDownloadExcel("Top_Customer_" + new Date().toISOString().slice(0,10) + ".xlsx", "Top Customer", out);
  });
}

/* ============================================================== *
 *  SALES > COMMODITY (Tyre)                                         *
 *  - Nilai & customer: Sales Invoice dengan Type = "Tyre" (IPE).    *
 *  - Item terlaris   : Parts Delivery, item ditandai Tyre lewat     *
 *    kolom Item No (E): diawali BD / BL, atau mengandung "TYRE".    *
 *    Daftar awalan ada di COMMODITY_TYRE di bawah — tambah di sini. *
 *  Nilai Rupiah (Invoice) dan Qty (Parts Delivery) berbeda sumber   *
 *  dan tidak saling dijumlahkan.                                    *

const COMMODITY_TYRE = { invoiceType: "tyre", itemPrefixes: ["BD", "BL"], itemContains: ["TYRE"] };
function tyreItemKind(itemNo){
  const it = String(itemNo || "").trim().toUpperCase();
  if(!it) return null;
  for(const p of COMMODITY_TYRE.itemPrefixes){ if(it.startsWith(p)) return p; }
  for(const c of COMMODITY_TYRE.itemContains){ if(it.includes(c)) return c; }
  return null;
}
async function renderCommodity(){
  const [invS, pdS, aliasMap] = await Promise.all([
    fetchSheet("invoices").catch(()=>null), fetchSheet("partsDelivery").catch(()=>null), getCustomerAliasMap()
  ]);

  const normType = t => String(t||"").trim().toLowerCase();

  // ---- Invoice (Type = Tyre) ----
