/* ============================================================== *
 *  PSSR PERFORMANCE — Revenue Invoice per PSSR vs Budget.           *
 *  Aturan (diskusi 2026-10-08):                                    *
 *   - Nama PSSR dari kolom "Sales Employee" di Sales Quotation,     *
 *     dihubungkan ke Invoice lewat Remarks "Based On Sales          *
 *     Quotations <no>.".                                            *
 *   - Invoice tanpa Quotation / "No Sales Employee" / PSSR kosong   *
 *     -> masuk ke PSSR default cabang tsb (PSSR_BRANCH_DEFAULT).    *
 *   - Override: SPT + Ihsan -> New Vacant; BJM + Ilham -> Jamruni.  *
 *   - Revenue IKE: seluruhnya ke PSSR default cabang (tanpa lihat   *
 *     Quotation).                                                   *
 *   - Budget Cabang = Budget PSSR (tab Budget per company).         *
 *   - Peringkat = Revenue / Budget (Achievement %).                 *
 *   - Kategori Type & nilai sama dengan Top Customer.               *
 * ============================================================== */
const PSSR_BRANCH_DEFAULT = {
  IPE: { SMD:"Arif Rahman", BJM:"Muhammad Jamruni", SPT:"New Vacant", PTK:"Japari", JKT:"Yudha Bagus Prabowo", SBY:"Margo Narimo" },
  IKE: { BJM:"Muhammad Ilham", JKT:"Yudha Bagus Prabowo", SBY:"Margo Narimo", PTK:"New Vacant", BPP:"Waliyadin", PKY:"Muhammad Ihsan" },
};
/* Override nama PSSR di Quotation IPE: [cabang, pola nama (regex), nama tujuan] */
const PSSR_IPE_OVERRIDES = [
  ["SPT", /ihsan/i, "New Vacant"],        // Ihsan = sales IKE yang diperbantukan sementara di Sampit (IPE)
  ["BJM", /ilham/i, "Muhammad Jamruni"],  // Ilham = sales IKE yang membantu penjualan IPE di Banjarmasin
];
async function fetchSheetForCompany(key, co){
  const cacheKey = co + ":" + key;
  if(sheetCache[cacheKey]) return sheetCache[cacheKey];
  const data = await fetchSheetRaw(sheetNameFor(key, co));
  sheetCache[cacheKey] = data;
  return data;
}
async function renderPssrPerformance(){
  const companies = currentCompany === "ALL" ? ["IPE", "IKE"] : [currentCompany];
  const safe = (key, co) => fetchSheetForCompany(key, co).catch(() => ({ cols: [], rows: [] }));
  const loaded = await Promise.all(companies.map(async co => {
    const [inv, quo, bud] = await Promise.all([safe("invoices", co), co === "IPE" ? safe("quotations", co) : Promise.resolve({ cols: [], rows: [] }), safe("budget", co)]);
    return { co, inv, quo, bud };
  }));
  const aliasMap = await getCustomerAliasMap();
  if(loaded.every(x => !x.inv.rows.length)){ pageBody.innerHTML = currentCompany === "IKE" ? noIkeDataBanner("PSSR Performance") : `<div class="card-shell"><div class="empty-note">Belum ada data Invoice.</div></div>`; return; }

  const TYPES = invoiceCategoryTypes();
  const normType = t => String(t||"").trim().toLowerCase();
  const typeIdx = {}; TYPES.forEach((t, i) => { typeIdx[normType(t)] = i; });
  const resolveBranch = b => { const n = normalizeBranch(b).toUpperCase(); return SUB_WAREHOUSE_OF[n] || n; };
  const canon = {}; // UPPER -> penulisan baku (dari konfigurasi)
  Object.values(PSSR_BRANCH_DEFAULT).forEach(m => Object.values(m).forEach(n => { canon[n.toUpperCase()] = n; }));
  const ipeOwnerBranch = {}; // PSSR IPE (UPPER) -> cabang asalnya; "New Vacant" tidak termasuk
  Object.entries(PSSR_BRANCH_DEFAULT.IPE).forEach(([b, n]) => { if(n.toUpperCase() !== "NEW VACANT") ipeOwnerBranch[n.toUpperCase()] = b; });
  const ipeNewVacant = n => n.toUpperCase() === "NEW VACANT";
  const recon = {}; // "CO|BR" -> { all, other{type:val}, pssr }
  const defaultFor = (co, br) => (PSSR_BRANCH_DEFAULT[co] || {})[br] || null;
  const groupKey = (name, br) => name.toUpperCase() === "NEW VACANT" ? "NEW VACANT|" + br : name.toUpperCase();
  const groupLabel = (name, br) => name.toUpperCase() === "NEW VACANT" ? "New Vacant (" + br + ")" : name;

  const groups = {}; // key -> { name, branches:Set, rev:{IPE,IKE}, budget:{IPE,IKE}, vals[], custs, invs }
  const getGroup = (name, br) => {
    const k = groupKey(name, br);
    if(!groups[k]) groups[k] = { name: groupLabel(name, br), branches: new Set(), rev: { IPE:0, IKE:0 }, budget: { IPE:0, IKE:0 }, vals: TYPES.map(() => 0), custs: new Set(), invs: new Set(), mtd: { rev:0, bud:0 }, ytd: { rev:0, bud:0 } };
    return groups[k];
  };
  const noPssrName = br => "No PSSR — " + (br || "?");
  const missingMap = new Set();
  let redirected = { n: 0, v: 0 }, missingCol = [];

  // Jendela waktu: periode filter (tabel utama) + MTD & YTD (acuan bulan = tanggal "To" filter, atau hari ini)
  const refDate = globalFilters.dateTo || globalFilters.dateFrom || new Date();
  const mtdStart = new Date(refDate.getFullYear(), refDate.getMonth(), 1);
  const mtdEnd = new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0, 23, 59, 59);
  const ytdStart = new Date(refDate.getFullYear(), 0, 1);
  const mtdKey = periodKey(refDate), ytdFromKey = refDate.getFullYear() + "-01";
  const mtdLabel = FULL_MONTH_NAMES_ID[refDate.getMonth()] + " " + refDate.getFullYear();
  const hasDateFilter = !!(globalFilters.dateFrom || globalFilters.dateTo);
  const inFilter = d => !hasDateFilter || (d instanceof Date && !isNaN(d) && (!globalFilters.dateFrom || d >= globalFilters.dateFrom) && (!globalFilters.dateTo || d <= globalFilters.dateTo));

  loaded.forEach(({ co, inv, quo, bud }) => {
    // --- Quotation -> nama PSSR (hanya IPE) ---
    const quoPssr = {};
    if(co === "IPE"){
      const cols = (quo.cols || []).map(c => String(c||"").trim());
      const pIdx = cols.findIndex(c => /sales\s*employee|sales\s*person|pssr/i.test(c));
      if(pIdx < 0 && quo.rows.length) missingCol.push(cols.join(" | "));
      if(pIdx >= 0) quo.rows.forEach(r => {
        const no = String(r[0] ?? "").trim(), nm = String(r[pIdx] ?? "").trim();
        if(no && nm) quoPssr[no] = nm;
      });
    }
    // --- Invoice ---
    let rows = rowsToObjects(inv, { branch:0, invoice:1, date:2, customer:3, type:4, remarks:6, value:7 });
    rows = rows.filter(r => r.invoice || r.date instanceof Date);
    applyCustomerAlias(rows, aliasMap);
    rows = applyFilters(rows, null, "branch"); // filter tanggal ditangani manual (periode + MTD + YTD)
    rows.forEach(r => {
      const ti = typeIdx[normType(r.type)];
      const okPer = inFilter(r.date);
      if(okPer){ // rekonsiliasi vs Dashboard: semua Type, per company+cabang
        const rk = co + "|" + resolveBranch(r.branch);
        if(!recon[rk]) recon[rk] = { co, br: resolveBranch(r.branch), all: 0, other: {}, pssr: 0 };
        const rv = toNum(r.value);
        recon[rk].all += rv;
        if(ti === undefined){ const tn = String(r.type||"").trim() || "(blank)"; recon[rk].other[tn] = (recon[rk].other[tn]||0) + rv; }
      }
      if(ti === undefined) return;
      const okMtd = r.date instanceof Date && r.date >= mtdStart && r.date <= mtdEnd;
      const okYtd = r.date instanceof Date && r.date >= ytdStart && r.date <= mtdEnd;
      if(!okPer && !okMtd && !okYtd) return;
      const br = resolveBranch(r.branch);
      const def = defaultFor(co, br);
      let name = null, viaDefault = false;
      if(co === "IPE"){
        const ref = extractRef(r.remarks, "Sales Quotations");
        let raw = (ref && quoPssr[ref.trim()]) || "";
        if(/^\W*no\s*sales\s*(employee|person)?\W*$/i.test(raw.trim()) || /^\W*(n\/?a|none|-+)\W*$/i.test(raw.trim())) raw = ""; // mis. "-No Sales Employee-"
        if(raw){
          name = raw.trim();
          PSSR_IPE_OVERRIDES.forEach(([ob, re, to]) => { if(br === ob && re.test(name)) name = to; });
          name = canon[name.toUpperCase()] || name;
          // PSSR IPE milik cabang LAIN (mis. Arif Rahman = SMD) tidak boleh muncul di cabang ini
          // (mis. SPT) — revenue-nya dialihkan ke PSSR default cabang tempat invoice terjadi.
          // Nama di luar daftar PSSR resmi IPE (mis. sudah resign) juga dialihkan ke PSSR default cabang,
          // supaya revenue cabang tidak hilang (Budget Cabang = Budget PSSR).
          const owner = ipeOwnerBranch[name.toUpperCase()];
          if(def && (!owner && !ipeNewVacant(name) || (owner && owner !== br))){ name = ""; }
        }
      }
      if(!name){ viaDefault = true; name = def; }
      if(!name){ missingMap.add(co + ":" + br); name = noPssrName(br); }
      const g = getGroup(name, br);
      const v = toNum(r.value);
      g.branches.add(br);
      if(okMtd) g.mtd.rev += v;
      if(okYtd) g.ytd.rev += v;
      if(okPer){
        recon[co + "|" + br].pssr += v;
        g.rev[co] += v; g.vals[ti] += v;
        const ck = normalizeCustomerKey(r.customer); if(ck) g.custs.add(ck);
        g.invs.add(co + "|" + (String(r.invoice||"").trim() || ("row" + g.invs.size)));
        if(viaDefault && co === "IPE"){ redirected.n++; redirected.v += v; }
      }
    });
    // --- Budget Cabang = Budget PSSR ---
    if(bud.rows.length){
      let br0 = rowsToObjects(bud, { month:0, branch:1, division:2, value:3 });

      const fk = (globalFilters.dateFrom && globalFilters.dateTo) ? periodKey(globalFilters.dateFrom) : null;

      const typeSet = new Set(TYPES.map(normType));
      if(br0.some(b => typeSet.has(normType(b.division)))) br0 = br0.filter(b => typeSet.has(normType(b.division)));
      br0.forEach(b => {
        const br = resolveBranch(b.branch);
        if(!br) return;
        const def = defaultFor(co, br);
        if(!def) missingMap.add(co + ":" + br);
        const g = getGroup(def || noPssrName(br), br);
        const bv = toNum(b.value);
        if(!fk || (b.period && b.period >= fk && b.period <= tk)){ g.budget[co] += bv; g.branches.add(br); }
        if(b.period === mtdKey) g.mtd.bud += bv;
        if(b.period && b.period >= ytdFromKey && b.period <= mtdKey) g.ytd.bud += bv;
      });
    }
  });

  let all = Object.values(groups).map(g => {
    g.revenue = g.rev.IPE + g.rev.IKE; g.bud = g.budget.IPE + g.budget.IKE;
    g.ach = g.bud ? g.revenue / g.bud * 100 : null;

  // PSSR tanpa Budget (mis. sudah resign) disembunyikan dari tabel & total; nilainya dicatat di catatan.

  const line = (g, i) => `<tr${i === null ? ' style="color:var(--ink-soft)"' : ""}>

  const winTotLine = `<tr style="border-top:2px solid var(--line);font-weight:700;"><td></td><td>Total</td><td></td>

  const winHtml = winRows.length ? `<div class="card-shell">
      <div class="card-title">MTD &amp; YTD — ${escapeHtml(mtdLabel)}</div>
      <div class="card-subtitle">MTD = bulan ${escapeHtml(mtdLabel)}; YTD = January to ${escapeHtml(FULL_MONTH_NAMES_ID[refDate.getMonth()])} ${refDate.getFullYear()} (bulan acuan mengikuti tanggal "To" di filter; tidak ikut rentang Dari–To). Diurutkan dari Achievement YTD tertinggi. Aturan Revenue, Budget, dan penentuan PSSR sama dengan tabel di bawah. PSSR tanpa Budget tidak ditampilkan${hiddenWin.length ? " (" + hiddenWin.length + " PSSR, YTD " + fmtRpShort(hiddenWin.reduce((a, g) => a + g.ytd.rev, 0)) + " tidak masuk total)" : ""}.</div>
      <div class="table-scroll"><table class="ast-table"><thead><tr><th>#</th><th>PSSR</th><th>Branch</th><th style="text-align:right">MTD Revenue</th><th style="text-align:right">MTD Budget</th><th style="text-align:right">MTD Ach.</th><th style="text-align:right">YTD Revenue</th><th style="text-align:right">YTD Budget</th><th style="text-align:right">YTD Ach.</th></tr></thead>
      <tbody>${winRows.map(winLine).join("")}${winTotLine}</tbody></table></div></div>` : "";
  const reconRows = Object.values(recon).filter(x => x.all).sort((a, z) => z.all - a.all);
  const reconHtml = reconRows.length ? `<div class="card-shell">
      <div class="card-title">Revenue Reconciliation vs Dashboard per Branch</div>
      <div class="card-subtitle">Period: <b>${escapeHtml(periodTxt)}</b>. <b>Revenue Dashboard</b> = semua baris Sales Invoice (semua Type). PSSR Performance hanya menghitung Type ${escapeHtml(TYPES.join(", "))}; Type lain ditampilkan di kolom "Types outside categories" (arahkan kursor untuk rincian per Type). Kolom "Check" harus 0 — kalau bukan 0 berarti ada revenue yang tidak terhitung di PSSR.</div>
      <div class="table-scroll"><table class="ast-table"><thead><tr><th>Branch</th><th style="text-align:right">Revenue Dashboard</th><th style="text-align:right">Types outside categories</th><th style="text-align:right">Revenue in PSSR Performance</th><th style="text-align:right">Check</th></tr></thead><tbody>${reconRows.map(x => {
        const oth = Object.values(x.other).reduce((a, b) => a + b, 0);
        const tip = Object.entries(x.other).sort((a, b) => b[1] - a[1]).map(([t, v]) => t + ": " + fmtRpShort(v)).join("\n");
        const chk = Math.round(x.all - oth - x.pssr);
        return `<tr><td>${escapeHtml(x.br + (showSplit ? " (" + x.co + ")" : ""))}</td><td style="text-align:right">${fmtRpShort(x.all)}</td><td style="text-align:right" title="${escapeHtml(tip)}">${oth ? fmtRpShort(oth) : "-"}</td><td style="text-align:right"><strong>${fmtRpShort(x.pssr)}</strong></td><td style="text-align:right;${chk ? "color:var(--red,#d64545);font-weight:700" : "color:var(--ink-soft)"}">${chk ? fmtRpShort(chk) : "0"}</td></tr>`;
      }).join("")}</tbody></table></div></div>` : "";
  const notes = [];
  if(hiddenMain.length) notes.push(hiddenMain.length + " PSSR tanpa Budget (mis. sudah resign) tidak ditampilkan dan tidak masuk total — revenue-nya " + fmtRpShort(hiddenMain.reduce((a, g) => a + g.revenue, 0)) + " pada periode ini.");
  if(missingMap.size) notes.push("Cabang tanpa PSSR default (revenue/budget-nya tampil sebagai \"No PSSR — cabang\"): <b>" + [...missingMap].sort().join(", ") + "</b>. Tambahkan di PSSR_BRANCH_DEFAULT.");
  if(missingCol.length) notes.push("Kolom PSSR tidak ditemukan di Sales Quotation (header: " + escapeHtml(missingCol[0]) + ") — semua revenue IPE dialihkan ke PSSR default cabang.");
  pageBody.innerHTML = `
    <div class="kpi-row">
      ${kpiCard("Total Revenue", fmtRpShort(totRev), periodTxt, "good")}
      ${kpiCard("Total Budget", totBud ? fmtRpShort(totBud) : "-", totBud ? "Budget Cabang = Budget PSSR" : "Budget belum ada pada periode ini", "neutral")}
      ${kpiCard("Achievement", totAch === null ? "-" : totAch + "%", ranked[0] ? "Top: " + ranked[0].name + " (" + Math.round(ranked[0].ach) + "%)" : "", totAch !== null && totAch >= 100 ? "good" : "bad")}
      ${kpiCard("Reassigned to Branch PSSR", redirected.n.toLocaleString("id-ID") + " invoice", fmtRpShort(redirected.v) + " (IPE tanpa Quotation / No Sales Employee / PSSR resign / PSSR cabang lain)", "neutral")}
    </div>
    ${winHtml}
    ${ranked.length ? chartCardShell("chart-pssr-ach", "Revenue vs Budget per PSSR", "Diurutkan dari Achievement tertinggi — label % di atas batang") : ""}
    <div class="card-shell">

      ${notes.map(n => `<div class="empty-note" style="margin-bottom:8px;">${n}</div>`).join("")}
      ${all.length
        ? `<div class="table-scroll"><table class="ast-table"><thead><tr>${head.map((h, i) => `<th${i >= 3 ? ' style="text-align:right"' : ''}>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${bodyHtml}</tbody></table></div>`
        : `<div class="empty-note">Belum ada data pada periode ini.</div>`}
    </div>

  if(ranked.length) drawAchievementBar("chart-pssr-ach", ranked.map(g => g.name), ranked.map(g => Math.round(g.revenue)), ranked.map(g => Math.round(g.bud)));
  const btn = document.getElementById("pssr-export");

    const add = (g, i) => out.push([i === null ? "" : i + 1, g.name, brTxt(g), Math.round(g.rev.IPE), Math.round(g.rev.IKE), Math.round(g.revenue), Math.round(g.bud), g.ach === null ? "" : Math.round(g.ach), g.bud ? Math.round(g.revenue - g.bud) : "", ...g.vals.map(v => Math.round(v)), g.custs.size, g.invs.size, Math.round(g.mtd.rev), Math.round(g.mtd.bud), g.mtd.bud ? Math.round(g.mtd.rev / g.mtd.bud * 100) : "", Math.round(g.ytd.rev), Math.round(g.ytd.bud), g.ytd.bud ? Math.round(g.ytd.rev / g.ytd.bud * 100) : ""]);
    ranked.forEach((g, i) => add(g, i)); unranked.forEach(g => add(g, null));
    ctDownloadExcel("PSSR_Performance_" + new Date().toISOString().slice(0,10) + ".xlsx", "PSSR Performance", out);
  });
}

/* ============================================================== *
 *  PENDAPATAN LAINNYA — Warranty (Approved), Rebate Program,        *
 *  Bundling Unit. Ditampilkan per mata uang ASAL (belum dikonversi  *
 *  ke Rp; tab Kurs belum dipakai). (diskusi 2026-10-08)             *
 *   - Warranty: tab Warranty, kolom Approved (+Curr), per cabang,   *
 *     tanggal = Claim Date.                                         *
 *   - Rebate: tab Rebate (HANYA IPE, HANYA Admin, tanpa filter      *
 *     cabang), hanya Status "Approved".                             *
 *   - Bundling Unit: menunggu struktur data.                        *
 * ============================================================== */
function fmtMoneyCur(v, curr){
  const c = String(curr||"").trim().toUpperCase();
  if(c === "IDR" || c === "RP" || c === "") return fmtRpShort(v);
  const sym = { GBP:"£", USD:"US$", EUR:"€" }[c];
  const num = Number(v).toLocaleString("id-ID", { maximumFractionDigits: 2 });
  return (sym ? sym + " " : c + " ") + num;
}
async function renderOtherIncome(){
  const session = getSession();
  const isAdmin = !!(session && session.role === "Admin");
  const refDate = globalFilters.dateTo || globalFilters.dateFrom || new Date();
  const mtdKey = periodKey(refDate), ytdFromKey = refDate.getFullYear() + "-01";
  const mtdLabel = FULL_MONTH_NAMES_ID[refDate.getMonth()] + " " + refDate.getFullYear();
  const fk = globalFilters.dateFrom ? periodKey(globalFilters.dateFrom) : null;
  const tk = globalFilters.dateTo ? periodKey(globalFilters.dateTo) : null;
  const periodTxt = (globalFilters.dateFrom || globalFilters.dateTo)
    ? `${globalFilters.dateFrom ? fmtDate(globalFilters.dateFrom) : "start"} to ${globalFilters.dateTo ? fmtDate(globalFilters.dateTo) : "now"}` : "All periods";
  const yearMonths = []; for(let m = 0; m <= refDate.getMonth(); m++) yearMonths.push(`${refDate.getFullYear()}-${String(m+1).padStart(2,"0")}`);

  const lines = {}; // "Sumber|Curr" -> { source, curr, per, mtd, ytd, monthly{pk} }
  const addLine = (source, curr, pk, v, inPer) => {
    const c = String(curr||"").trim().toUpperCase() || "?";
    const k = source + "|" + c;
    if(!lines[k]) lines[k] = { source, curr: c, per: 0, mtd: 0, ytd: 0, monthly: {} };
    const L = lines[k];
    if(inPer) L.per += v;
    if(pk === mtdKey) L.mtd += v;
    if(pk && pk >= ytdFromKey && pk <= mtdKey){ L.ytd += v; L.monthly[pk] = (L.monthly[pk]||0) + v; }
  };
  const inPeriodPk = pk => pk && (!fk || pk >= fk) && (!tk || pk <= tk);

  // ---- Warranty Approved ----
  const warBranch = {}; // branch|curr -> per
  try{
    const ws = await fetchSheet("warranty");
    let wr = rowsToObjects(ws, { externalNo:2, claimDate:6, approvedValue:7, approvedCurr:8 });
    wr = wr.filter(r => r.externalNo);
    wr.forEach(r => { r.branch = String(r.externalNo).split("-")[0].trim(); });
    wr = applyFilters(wr, null, "branch");
    wr.forEach(r => {
      const v = toNum(r.approvedValue); if(!v) return;
      const pk = periodKey(r.claimDate);
      const inPer = (globalFilters.dateFrom || globalFilters.dateTo) ? inPeriodPk(pk) && ((!globalFilters.dateFrom || r.claimDate >= globalFilters.dateFrom) && (!globalFilters.dateTo || r.claimDate <= globalFilters.dateTo)) : true;
      addLine("Warranty (Approved)", r.approvedCurr, pk, v, inPer);
      if(inPer){ const bk = r.branch + "|" + (String(r.approvedCurr||"").trim().toUpperCase() || "?"); warBranch[bk] = (warBranch[bk]||0) + v; }
    });
  }catch(e){ /* tab Warranty belum ada — lewati */ }

  // ---- Rebate Program (IPE saja, Admin saja) ----
  let rebateNote = "", rebateProg = {};
  if(!isAdmin){ rebateNote = ""; }
  else if(currentCompany === "IKE"){ rebateNote = "Program Rebate hanya berlaku untuk IPE — tidak ada data Rebate untuk IKE."; }
  else {
    try{
      const rs = await fetchSheetForCompany("rebate", "IPE");
      const cols = (rs.cols || []).map(c => String(c||"").trim().toLowerCase());
      const ix = (re, d) => { const i = cols.findIndex(c => re.test(c)); return i >= 0 ? i : d; };
      const toPk = v => {
        if(v instanceof Date) return periodKey(v);
        const t = parseMonthYearText(v); if(t) return t;
        const d = new Date(v); return isNaN(d) ? null : periodKey(d);
      };
      // Normalisasi 2 format tab "Rebate Program" menjadi daftar klaim { pk, prog, curr, amt, jc, mach }:
      //  (A) FORMAT BARU: Date, Dealer, Job Card Value, Number of Machines, Average Value per machine,
      //      lalu satu KOLOM per program (nilai rebate di kolom program). Tidak ada Status/Curr -> semua
      //      baris dianggap Approved, mata uang GBP.
      //  (B) FORMAT LAMA (panjang): Month, Program Type, Amount, Curr, Status.
      const claims = [];
      const iAvg = ix(/average value/, -1);
      if(iAvg >= 0){
        const iD = ix(/^date|tanggal/, 0), iJ = ix(/job card/, -1), iN = ix(/number of machines|machines/, -1);
        const progCols = [];
        for(let c = iAvg + 1; c < (rs.cols || []).length; c++){
          const raw = String(rs.cols[c] || "").trim(); if(!raw) continue;
          progCols.push({ c, name: raw.split(/\n/)[0].replace(/\s*\(.*\)\s*$/, "").trim() || raw });
        }
        rs.rows.forEach(r => {
          const pk = toPk(r[iD]); if(!pk) return;
          let first = true;
          progCols.forEach(pc => {
            const v = toNum(r[pc.c]); if(!v) return;
            claims.push({ pk, prog: pc.name, curr: "GBP", amt: v, jc: first && iJ >= 0 ? toNum(r[iJ]) : 0, mach: first && iN >= 0 ? toNum(r[iN]) : 0 });
            first = false;
          });
        });
        rebateNote = "Format Rebate Program baru: tidak ada kolom Status dan Curr — semua baris dihitung Approved dalam GBP.";
      } else {
        const iM = ix(/month|bulan/, 0), iP = ix(/program/, 1), iA = ix(/amount|nilai/, 2), iC = ix(/curr/, 3), iS = ix(/status/, -1);
        if(iS < 0) rebateNote = "Kolom Status tidak ditemukan di tab Rebate Program — semua baris dihitung sebagai Approved.";
        rs.rows.forEach(r => {
          if(iS >= 0 && !/^approved$/i.test(String(r[iS]||"").trim())) return;
          const v = toNum(r[iA]); if(!v) return;
          const pk = toPk(r[iM]); if(!pk) return;
          claims.push({ pk, prog: String(r[iP]||"").trim() || "(no program)", curr: String(r[iC]||"").trim().toUpperCase() || "?", amt: v, jc: 0, mach: 0 });
        });
      }
      claims.forEach(cl => {
        const pk = cl.pk, v = cl.amt, curr = cl.curr;
        const inPer = (!fk && !tk) ? true : inPeriodPk(pk);
        addLine("Rebate Program", curr, pk, v, inPer);
        const key = cl.prog + "|" + curr;
        if(!rebateProg[key]) rebateProg[key] = { prog: cl.prog, curr, per: 0, mtd: 0, ytd: 0, monthly: {}, claims: 0, jc: 0, mach: 0 };
        const R = rebateProg[key];
        if(inPer) R.per += v;
        if(pk === mtdKey) R.mtd += v;
        if(pk >= ytdFromKey && pk <= mtdKey){ R.ytd += v; R.monthly[pk] = (R.monthly[pk]||0) + v; R.claims++; R.jc += cl.jc; R.mach += cl.mach; }
      });
      if(globalFilters.branch !== "ALL") rebateNote = (rebateNote ? rebateNote + " " : "") + "Rebate berlaku untuk semua cabang — angkanya tidak ikut filter Cabang.";
    }catch(e){ rebateNote = "Tab Rebate belum bisa dibaca (" + escapeHtml(e.message || e) + ")."; }
  }

  const all = Object.values(lines).sort((a, z) => a.source.localeCompare(z.source) || a.curr.localeCompare(z.curr));
  const kpis = all.map(L => kpiCard(L.source + " — " + L.curr, fmtMoneyCur(L.per, L.curr), "YTD " + fmtMoneyCur(L.ytd, L.curr) + " · MTD " + fmtMoneyCur(L.mtd, L.curr), "good")).join("");
  const rowHtml = L => `<tr><td>${escapeHtml(L.source)}</td><td>${escapeHtml(L.curr)}</td><td style="text-align:right">${fmtMoneyCur(L.per, L.curr)}</td><td style="text-align:right">${fmtMoneyCur(L.mtd, L.curr)}</td><td style="text-align:right">${fmtMoneyCur(L.ytd, L.curr)}</td></tr>`;
  const monthHead = yearMonths.map(pk => `<th style="text-align:right">${escapeHtml(periodLabel(pk))}</th>`).join("");
  const monthRows = all.map(L => `<tr><td>${escapeHtml(L.source)} (${escapeHtml(L.curr)})</td>${yearMonths.map(pk => `<td style="text-align:right">${L.monthly[pk] ? fmtMoneyCur(L.monthly[pk], L.curr) : '<span style="color:var(--ink-soft)">-</span>'}</td>`).join("")}<td style="text-align:right"><strong>${fmtMoneyCur(L.ytd, L.curr)}</strong></td></tr>`).join("");
  const warBrRows = Object.entries(warBranch).map(([k, v]) => { const [b, c] = k.split("|"); return { b, c, v }; }).sort((a, z) => z.v - a.v);
  const rebRows = Object.values(rebateProg).sort((a, z) => z.ytd - a.ytd);

  pageBody.innerHTML = `
    <div class="kpi-row">
      ${kpis || kpiCard("Other Income", "-", "Belum ada data pada periode ini", "neutral")}
      ${kpiCard("Bundling Unit", "Coming Soon", "Menunggu struktur data", "neutral")}
    </div>
    <div class="card-shell">
      <div class="card-title">Summary per Source &amp; Currency</div>
      <div class="card-subtitle">Periode filter: <b>${escapeHtml(periodTxt)}</b>. MTD = ${escapeHtml(mtdLabel)}; YTD = January to ${escapeHtml(FULL_MONTH_NAMES_ID[refDate.getMonth()])} ${refDate.getFullYear()} (bulan acuan mengikuti tanggal "To"). Nilai ditampilkan dalam <b>mata uang asal</b> dan <b>belum dikonversi ke Rupiah</b>, sehingga tidak dijumlahkan antar mata uang.${isAdmin ? "" : " Program Rebate hanya terlihat oleh Admin."}</div>
      ${rebateNote ? `<div class="empty-note" style="margin-bottom:8px;">${rebateNote}</div>` : ""}
      ${all.length ? `<div class="table-scroll"><table class="ast-table"><thead><tr><th>Source</th><th>Curr</th><th style="text-align:right">Filter Period</th><th style="text-align:right">MTD</th><th style="text-align:right">YTD</th></tr></thead><tbody>${all.map(rowHtml).join("")}</tbody></table></div>` : `<div class="empty-note">Belum ada data.</div>`}
    </div>
    ${all.length ? `<div class="card-shell"><div class="card-title">Per Month — ${refDate.getFullYear()}</div><div class="table-scroll"><table class="ast-table"><thead><tr><th>Source</th>${monthHead}<th style="text-align:right">YTD</th></tr></thead><tbody>${monthRows}</tbody></table></div></div>` : ""}
    ${warBrRows.length ? `<div class="card-shell"><div class="card-title">Warranty Approved per Branch (filter period)</div><div class="table-scroll"><table class="ast-table"><thead><tr><th>Branch</th><th>Curr</th><th style="text-align:right">Approved</th></tr></thead><tbody>${warBrRows.map(x => `<tr><td>${escapeHtml(x.b)}</td><td>${escapeHtml(x.c)}</td><td style="text-align:right">${fmtMoneyCur(x.v, x.c)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    ${rebRows.length ? `<div class="card-shell"><div class="card-title">Rebate Program per Program Type — ${refDate.getFullYear()}</div><div class="card-subtitle">Per bulan sampai ${escapeHtml(FULL_MONTH_NAMES_ID[refDate.getMonth()])} ${refDate.getFullYear()} (bulan acuan mengikuti tanggal "Sampai"), mata uang asal, hanya Status Approved.</div><div class="table-scroll"><table class="ast-table"><thead><tr><th>Program</th><th>Curr</th>${monthHead}<th style="text-align:right">YTD</th></tr></thead><tbody>${rebRows.map(x => `<tr><td>${escapeHtml(x.prog)}</td><td>${escapeHtml(x.curr)}</td>${yearMonths.map(pk => `<td style="text-align:right">${x.monthly[pk] ? fmtMoneyCur(x.monthly[pk], x.curr) : '<span style="color:var(--ink-soft)">-</span>'}</td>`).join("")}<td style="text-align:right"><strong>${fmtMoneyCur(x.ytd, x.curr)}</strong></td></tr>`).join("")}${[...new Set(rebRows.map(x => x.curr))].map(c => { const rs2 = rebRows.filter(x => x.curr === c); return `<tr style="border-top:2px solid var(--line);font-weight:700;"><td>Total</td><td>${escapeHtml(c)}</td>${yearMonths.map(pk => { const t = rs2.reduce((a, x) => a + (x.monthly[pk]||0), 0); return `<td style="text-align:right">${t ? fmtMoneyCur(t, c) : "-"}</td>`; }).join("")}<td style="text-align:right">${fmtMoneyCur(rs2.reduce((a, x) => a + x.ytd, 0), c)}</td></tr>`; }).join("")}</tbody></table></div></div>` : ""}
    ${rebRows.some(x => x.jc) ? `<div class="card-shell"><div class="card-title">Rebate vs Job Card Value per Program — YTD</div><div class="card-subtitle">Job Card Value dan jumlah mesin diambil dari tab Rebate Program (satu baris = satu klaim). Rebate % = Rebate ÷ Job Card Value.</div><div class="table-scroll"><table class="ast-table"><thead><tr><th>Program</th><th>Curr</th><th style="text-align:right"># Claims</th><th style="text-align:right"># Machines</th><th style="text-align:right">Job Card Value</th><th style="text-align:right">Rebate</th><th style="text-align:right">Rebate %</th></tr></thead><tbody>${rebRows.filter(x => x.claims).map(x => `<tr><td>${escapeHtml(x.prog)}</td><td>${escapeHtml(x.curr)}</td><td style="text-align:right">${x.claims.toLocaleString("id-ID")}</td><td style="text-align:right">${x.mach.toLocaleString("id-ID")}</td><td style="text-align:right">${fmtMoneyCur(x.jc, x.curr)}</td><td style="text-align:right"><strong>${fmtMoneyCur(x.ytd, x.curr)}</strong></td><td style="text-align:right">${x.jc ? (x.ytd / x.jc * 100).toFixed(1) + "%" : "-"}</td></tr>`).join("")}${[...new Set(rebRows.filter(x => x.claims).map(x => x.curr))].map(c => { const r2 = rebRows.filter(x => x.claims && x.curr === c); const j = r2.reduce((a, x) => a + x.jc, 0), y = r2.reduce((a, x) => a + x.ytd, 0); return `<tr style="border-top:2px solid var(--line);font-weight:700;"><td>Total</td><td>${escapeHtml(c)}</td><td style="text-align:right">${r2.reduce((a, x) => a + x.claims, 0).toLocaleString("id-ID")}</td><td style="text-align:right">${r2.reduce((a, x) => a + x.mach, 0).toLocaleString("id-ID")}</td><td style="text-align:right">${fmtMoneyCur(j, c)}</td><td style="text-align:right">${fmtMoneyCur(y, c)}</td><td style="text-align:right">${j ? (y / j * 100).toFixed(1) + "%" : "-"}</td></tr>`; }).join("")}</tbody></table></div></div>` : ""}`;
}

/* ============================================================== *
 *  Login screen wiring                                             *
 * ============================================================== */
function showLoginScreen(message){
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("content").style.visibility = "hidden";
  document.getElementById("sidebar").style.visibility = "hidden";
  const err = document.getElementById("login-error");
  if(message){ err.textContent = message; err.style.display = "block"; }
  else { err.style.display = "none"; }
}

function hideLoginScreen(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("content").style.visibility = "visible";
  document.getElementById("sidebar").style.visibility = "visible";
}

function applySessionToProfile(session){
  document.getElementById("profile-avatar").textContent = (session.name || session.username || "?").charAt(0).toUpperCase();
  document.getElementById("profile-name").textContent = session.name || session.username;
  document.getElementById("profile-role").textContent = session.role === "Admin" ? "Admin (all branches)" : ("Branch " + session.branch);
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-submit");
  btn.disabled = true; btn.textContent = "Memeriksa…";
  try{
    const session = await doLogin(username, password);
    applySessionToProfile(session);
    hideLoginScreen();
    startApp();
  }catch(err){
    showLoginScreen(err.message || "Login gagal");
  }finally{
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

document.getElementById("profile-row").addEventListener("click", async () => {
  if(!confirm("Logout dari dashboard?")) return;
  clearInterval(refreshTimer);
  await doLogout();
  clearCache();
  showLoginScreen();
});

/* ============================================================== *
 *  App bootstrap                                                   *
 * ============================================================== */
function justifySidebarBrand(){
  const nameEl = document.getElementById("brand-name");
  const subEl = document.getElementById("brand-sub");
  if(!nameEl || !subEl) return;
  subEl.style.letterSpacing = "2px"; // reset ke default sebelum diukur ulang
  const targetWidth = nameEl.offsetWidth;
  const text = subEl.textContent || "";
  const n = text.length;
  if(n < 2 || targetWidth <= 0) return;
  const naturalWidth = subEl.offsetWidth;
  if(targetWidth <= naturalWidth) return;
  let gap = 2 + (targetWidth - naturalWidth) / (n - 1);
  subEl.style.letterSpacing = gap + "px";
  // koreksi kedua untuk pembulatan render browser
  const check = subEl.offsetWidth;
  if(Math.abs(check - targetWidth) > 1){
    gap += (targetWidth - check) / (n - 1);
    subEl.style.letterSpacing = gap + "px";
  }
}

let refreshTimer = null;
function startApp(){
  renderSidebar();
  renderHeader();
  renderFilterBar();
  loadPage(currentPage);
  justifySidebarBrand();
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => refreshCurrentPage(false), CONFIG.REFRESH_MS);
}

const existingSession = getSession();
if(existingSession){
  applySessionToProfile(existingSession);
  hideLoginScreen();
  startApp();
}else{
  showLoginScreen();
}
